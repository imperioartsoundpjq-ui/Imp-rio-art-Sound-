header{padding:12px 16px;background:linear-gradient(135deg,#071326,#020813);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 8px 24px #0005}

main{max-width:850px;margin:auto;padding:16px}
h2{font-size:18px;margin:8px 0 14px}h3{font-size:15px;margin:0 0 10px}

button,.button{border:0;border-radius:10px;padding:12px 14px;background:linear-gradient(135deg,#0878ff,#075bd4);color:white;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px #0878ff22}
button.secondary{background:#10243d;border:1px solid #2c4d73;box-shadow:none}button.gold{background:var(--gold);color:#071326}button.danger{background:#a9233e}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat,.card,.formbox{background:linear-gradient(145deg,#10233b,#0a1729);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 22px #0002}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:21px;font-weight:800;margin-top:6px;overflow-wrap:anywhere}.goldtext{color:var(--gold)}.redtext{color:#ff6d78}.green{color:var(--green)}
.field{margin-bottom:12px}.field label{display:block;color:#d0d0d7;font-size:12px;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;background:#071629;color:var(--text);border:1px solid #29496d;border-radius:9px;padding:12px;font:inherit;min-width:0;outline-color:#1687ff}.field textarea{min-height:78px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.hidden{display:none!important}
.card{margin-bottom:10px}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.cardtitle{font-weight:800;font-size:16px}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}.money{font-weight:800;color:var(--gold);white-space:nowrap}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#35353d;color:#e9e9ee;font-size:11px;margin-top:8px}.badge.pronto,.badge.entregue{background:#173d2b;color:#8ce5b1}.badge.producao{background:#483815;color:#f2d184}.badge.pendente{background:#47232a;color:#ff9aa3}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{padding:9px 10px;font-size:12px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

.small{font-size:12px;color:var(--muted);line-height:1.5}.section{margin-bottom:22px}
.cost-line{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:7px;align-items:center;margin:8px 0}.cost-line input{min-width:0}.budget-result{border:1px solid #23558a;border-radius:14px;padding:14px;margin:12px 0;background:linear-gradient(135deg,#0c2340,#101c32)}.budget-result .big{font-size:26px;font-weight:800;color:var(--gold)}

const app=document.getElementById('app');
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dateNow=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function allRecords(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}
function putLocal(x){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});}
function delLocal(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});}
async function putRecord(x){await putLocal(x);if(currentUser&&supabaseClient){const {error}=await supabaseClient.from('app_records').upsert({user_id:currentUser.id,record_id:String(x.id),data:x},{onConflict:'user_id,record_id'});if(error)alert('Salvo neste aparelho, mas a nuvem não foi atualizada: '+error.message);} }
async function delRecord(id){await delLocal(id);if(currentUser&&supabaseClient){const {error}=await supabaseClient.from('app_records').delete().eq('user_id',currentUser.id).eq('record_id',String(id));if(error)alert('Excluído neste aparelho, mas não na nuvem: '+error.message);} }
async function refresh(){records=await allRecords();render();}
async function replaceLocal(list){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE);store.clear();list.forEach(x=>store.put(x));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function syncFromCloud(){if(!currentUser||!supabaseClient||syncBusy)return;syncBusy=true;try{const {data,error}=await supabaseClient.from('app_records').select('data').eq('user_id',currentUser.id);if(error)throw error;await replaceLocal((data||[]).map(x=>x.data).filter(Boolean));await refresh();}catch(e){console.error(e);app.innerHTML='<div class="card"><h2>Falha na sincronização</h2><p class="small">Os dados locais foram mantidos. Confira a conexão e as configurações da nuvem.</p><p class="small">'+esc(e.message||e)+'</p><button onclick="syncFromCloud()">Tentar novamente</button></div>';}finally{syncBusy=false;}}
function scheduleCloudSync(){if(syncTimer)clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncFromCloud(),600);} 
function authScreen(message=''){document.querySelector('.nav').style.display='none';app.innerHTML=`<div style="max-width:480px;margin:8vh auto 0"><div class="card"><div class="brand"><img class="brand-logo" src="${LOGO_DATA}" alt="Logo Império Art Sound"><span>IMPÉRIO ART SOUND</span></div><h2 style="margin-top:20px">Acesso à sua conta</h2><p class="small">Entre com seu e-mail e senha para acessar seus dados sincronizados no celular e no computador.</p>${message?`<p class="small redtext">${esc(message)}</p>`:''}<form id="authForm"><div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="username" required placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Mínimo de 8 caracteres"></div><button type="submit" style="width:100%">Entrar</button></form><button class="secondary" style="width:100%;margin-top:10px" onclick="signUp()">Criar minha conta</button><p class="small" style="margin-top:14px">Use uma senha forte e não compartilhe seu acesso. O cadastro exige que a configuração do banco na nuvem esteja concluída.</p></div></div>`;document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await supabaseClient.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)authScreen(error.message);});}
async function signUp(){const form=document.getElementById('authForm');if(!form.reportValidity())return;const f=new FormData(form);const {data,error}=await supabaseClient.auth.signUp({email:f.get('email'),password:f.get('password')});if(error)authScreen(error.message);else authScreen(data.session?'Conta criada. Entrando…':'Conta criada. Confira seu e-mail para confirmar o cadastro e depois entre.');}
async function startCloudApp(){document.querySelector('.nav').style.display='flex';await syncFromCloud();if(!cloudChannel){cloudChannel=supabaseClient.channel('app-records-'+currentUser.id).on('postgres_changes',{event:'*',schema:'public',table:'app_records',filter:'user_id=eq.'+currentUser.id},()=>scheduleCloudSync()).subscribe();}window.addEventListener('focus',scheduleCloudSync);}

function orders(){return records.filter(x=>x.kind==='order').sort((a,b)=>(b.created||'').localeCompare(a.created||''));}
function expenses(){return records.filter(x=>x.kind==='expense').sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function received(o){return (o.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);}
function costs(o){return Number(o.cost||0);}
function balance(o){return Number(o.price||0)-received(o);}
function profit(o){return Number(o.price||0)-costs(o);}
function fmtDate(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`;}
function statusClass(s){return ({'Pronto':'pronto','Entregue':'entregue','Em produção':'producao','Aguardando':'pendente'})[s]||'';}
function orderCard(o){return `<div class="card"><div class="cardtop"><div><div class="cardtitle">#${esc(o.number||'—')} · ${esc(o.client||'Sem nome')}</div><div class="meta">${esc(o.type||'Caixa personalizada')} • Entrega: ${fmtDate(o.due)}<br>${esc(o.city||'')}</div><span class="badge ${statusClass(o.status)}">${esc(o.status||'Aguardando')}</span></div><div class="money">${brl(o.price)}</div></div><div class="meta">Recebido: ${brl(received(o))} · Falta: <b>${brl(balance(o))}</b></div>${o.photos?.length?`<div>${o.photos.map(p=>`<img class="thumb" src="${p.data}" alt="Anexo">`).join('')}</div>`:''}<div class="actions"><button class="secondary" onclick="viewOrder('${o.id}')">Detalhes</button><button class="secondary" onclick="editOrder('${o.id}')">Editar</button><button class="secondary" onclick="addPayment('${o.id}')">＋ Pagamento</button><button class="secondary" onclick="advanceStatus('${o.id}')">Mudar status</button></div></div>`;}
function render(){
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
if(tab==='inicio')renderHome();else if(tab==='pedidos')renderOrders();else if(tab==='novo')renderOrderForm();else if(tab==='despesas')renderExpenses();else if(tab==='orcamento')renderBudget();else if(tab==='proposta')renderCustomerQuote();else if(tab==='graficos')renderCharts();else if(tab==='corte')renderCutPlanner();else renderBackup();
}
function renderHome(){
const os=orders(), ex=expenses().filter(e=>(e.scope||'loja')==='loja'), revenue=os.reduce((s,o)=>s+Number(o.price||0),0), paid=os.reduce((s,o)=>s+received(o),0), pending=os.reduce((s,o)=>s+balance(o),0), expenseSum=ex.reduce((s,e)=>s+Number(e.amount||0),0), estimated=os.reduce((s,o)=>s+profit(o),0)-expenseSum;
app.innerHTML=`<h2>Resumo da loja</h2><div class="stats">
<div class="stat"><div class="label">Pedidos ativos</div><div class="value">${os.filter(o=>o.status!=='Entregue').length}</div></div>
<div class="stat"><div class="label">Total vendido</div><div class="value">${brl(revenue)}</div></div>
<div class="stat"><div class="label">Já recebido</div><div class="value green">${brl(paid)}</div></div>
<div class="stat"><div class="label">A receber</div><div class="value redtext">${brl(pending)}</div></div></div>
<div class="stats"><div class="stat"><div class="label">Despesas lançadas</div><div class="value">${brl(expenseSum)}</div></div><div class="stat"><div class="label">Lucro estimado*</div><div class="value goldtext">${brl(estimated)}</div></div></div>
<p class="small">*Estimativa: valor dos pedidos menos custo informado em cada pedido e despesas registradas. Para pedidos sem custo preenchido, o lucro pode ficar superestimado.</p>
<div class="section"><div class="row"><h2 style="flex:1">Pedidos recentes</h2><button class="secondary" onclick="setTab('pedidos')">Ver todos</button></div>${os.slice(0,4).map(orderCard).join('')||'<div class="empty">Nenhum pedido cadastrado ainda.</div>'}</div>
<button class="gold" style="width:100%" onclick="setTab('novo')">＋ Cadastrar pedido</button>`;
}
function renderOrders(){
app.innerHTML=`<div class="card order-brand-card" style="display:flex;align-items:center;gap:14px;margin-bottom:14px;border-color:#8e16d8;background:linear-gradient(120deg,#10051f,#21103a)"><img src="${LOGO_DATA}" alt="Logo oficial Império Art Sound" style="width:82px;height:76px;object-fit:contain;background:#000;border:1px solid #7c22bb;border-radius:10px;padding:3px"><div><div style="font-weight:900;font-size:18px;letter-spacing:.3px"><span style="color:#ff315e">IMPÉRIO</span> ART SOUND</div><div class="small">Pedidos e acompanhamento de clientes</div></div></div><h2>Pedidos</h2><div class="toolbar"><input id="searchOrders" placeholder="Buscar cliente, cidade ou nº do pedido" oninput="filterOrders()"><select id="filterStatus" onchange="filterOrders()" style="max-width:145px;background:#101013;color:white;border:1px solid #333;border-radius:9px;padding:8px"><option value="">Todos</option><option>Aguardando</option><option>Em produção</option><option>Pronto</option><option>Entregue</option></select></div><div id="orderList">${orders().map(orderCard).join('')||'<div class="empty">Seus pedidos aparecerão aqui.</div>'}</div>`;
}
function filterOrders(){const q=document.getElementById('searchOrders').value.toLowerCase(),s=document.getElementById('filterStatus').value;const list=orders().filter(o=>(!s||o.status===s)&&[o.client,o.city,o.number,o.type].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('orderList').innerHTML=list.map(orderCard).join('')||'<div class="empty">Nenhum pedido encontrado.</div>';}
function renderOrderForm(o={}){

async function resizeImage(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve({name:file.name,data:c.toDataURL('image/jpeg',.78)});};img.onerror=()=>resolve({name:file.name,data:reader.result});img.src=reader.result;};reader.readAsDataURL(file);});}
function renderPhotoPreview(){document.getElementById('photoPreview').innerHTML=window._formPhotos.map((p,i)=>`<span><img class="thumb" src="${p.data}"><button type="button" class="secondary" onclick="removePhoto(${i})">Remover</button></span>`).join('');}
function removePhoto(i){window._formPhotos.splice(i,1);renderPhotoPreview();}

function removePaymentForm(i){window._formPayments.splice(i,1);renderPaymentsForm();updateCalc();}

function updateCalc(){const f=document.getElementById('orderForm');if(!f)return;const price=Number(f.elements.price.value||0),cost=Number(f.elements.cost.value||0),paid=window._formPayments.reduce((s,p)=>s+Number(p.amount||0),0);document.getElementById('calcInfo').textContent=`Recebido: ${brl(paid)} · Saldo: ${brl(price-paid)} · Lucro estimado neste pedido: ${brl(price-cost)}`;}
async function saveOrder(e){e.preventDefault();const f=e.target,old=editing?records.find(x=>x.id===editing):null;const data=Object.fromEntries(new FormData(f).entries());const number=old?.number||String(Math.max(0,...orders().map(o=>Number(o.number)||0))+1).padStart(4,'0');const o={...(old||{}),...data,id:old?.id||crypto.randomUUID(),kind:'order',number,created:old?.created||new Date().toISOString(),price:Number(data.price||0),cost:Number(data.cost||0),payments:window._formPayments,photos:window._formPhotos};await putRecord(o);editing=null;await refresh();tab='pedidos';render();alert('Pedido salvo neste aparelho. Faça backup regularmente em Dados.');}

function renderExpenses(scope='loja'){
 const all=expenses(); const selected=all.filter(e=>(e.scope||'loja')===scope); const total=selected.reduce((sum,e)=>sum+Number(e.amount||0),0);

 <div class="stats"><div class="stat"><div class="label">Total de ${isPersonal?'gastos pessoais':'despesas da loja'}</div><div class="value ${isPersonal?'redtext':'goldtext'}">${brl(total)}</div></div><div class="stat"><div class="label">Lançamentos</div><div class="value">${selected.length}</div></div></div>
 <div class="formbox"><h3>${isPersonal?'Despesas pessoais':'Despesas da loja'}</h3><form id="expenseForm"><div class="grid2"><div class="field"><label>Descrição *</label><input name="description" required placeholder="${isPersonal?'Ex.: mercado, aluguel, transporte':'Ex.: MDF, cola, energia'}"></div><div class="field"><label>Valor (R$) *</label><input name="amount" required type="number" min=".01" step=".01" placeholder="0,00"></div><div class="field"><label>Data</label><input name="date" type="date" value="${dateNow()}"></div><div class="field"><label>Categoria</label><select name="category">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div></div><button type="submit">Registrar ${isPersonal?'despesa pessoal':'despesa da loja'}</button></form></div>
 <hr><h3>Registros · Total ${brl(total)}</h3>${selected.map(e=>`<div class="card"><div class="cardtop"><div><b>${esc(e.description)}</b><div class="meta">${fmtDate(e.date)} · ${esc(e.category||'Outros')}</div></div><div class="money">${brl(e.amount)}</div></div><div class="actions"><button class="danger" onclick="deleteExpense('${e.id}')">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhuma despesa registrada nesta área.</div>'}`;
 document.getElementById('expenseForm').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());await putRecord({...d,id:crypto.randomUUID(),kind:'expense',scope,amount:Number(d.amount),created:new Date().toISOString()});renderExpenses(scope);});
}

let budgetMaterials=[];
function renderBudget(){
 app.innerHTML=`<h2>Orçamento e preço de venda</h2>
 <p class="small">Calcule o custo de material, mão de obra, despesas indiretas e margem desejada antes de passar o preço ao cliente.</p>
 <div class="formbox section"><h3>1. Dados do orçamento</h3><div class="grid2">
 <div class="field"><label>Nome do orçamento / produto</label><input id="bName" placeholder="Ex.: caixa de grave"></div>
 <div class="field"><label>Cliente (opcional)</label><input id="bClient" placeholder="Nome do cliente"></div>
 <div class="field"><label>Horas de trabalho</label><input id="bHours" type="number" min="0" step=".5" value="0"></div>
 <div class="field"><label>Valor da sua hora (R$)</label><input id="bHourly" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Outros custos (R$)</label><input id="bOther" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Margem de lucro desejada (%)</label><input id="bMargin" type="number" min="0" max="95" step="1" value="30"></div>
 <div class="field"><label>Taxas/impostos sobre venda (%)</label><input id="bFees" type="number" min="0" max="99" step=".1" value="0"></div>
 <div class="field"><label>Desconto ao cliente (%)</label><input id="bDiscount" type="number" min="0" max="90" step=".1" value="0"></div>
 </div></div>
 <div class="formbox section"><h3>2. Materiais e quantidades</h3>
 <div class="cost-line"><div class="field"><label>Material / peça</label><input id="bmName" placeholder="MDF 18 mm, cola, parafuso..."></div><div class="field"><label>Custo total (R$)</label><input id="bmCost" type="number" min="0" step=".01" placeholder="0,00"></div><div class="field"><label>Qtd.</label><input id="bmQty" type="number" min="1" step="1" value="1"></div></div>
 <button onclick="addBudgetMaterial()">＋ Adicionar material</button><div id="budgetMaterialsList" style="margin-top:12px"></div>
 </div>
 <div class="formbox section"><h3>3. Calcular preço</h3>
 <button class="gold" style="width:100%" onclick="calculateBudget()">Calcular orçamento</button>
 <div id="budgetOutput"><div class="empty">Adicione os materiais e calcule.</div></div>
 </div>
 <div class="formbox section"><h3>4. Salvar como pedido</h3>
 <p class="small">Depois de calcular, você pode criar um pedido com o preço sugerido. Confira os dados antes de salvar.</p>
 <button class="secondary" style="width:100%" onclick="saveBudgetAsOrder()">Salvar orçamento como pedido</button>
 <p class="small">O custo de material será somado ao custo do pedido quando o campo correspondente estiver disponível. Guarde a lista detalhada do orçamento no campo de observações, se necessário.</p>
 </div>`;
 renderBudgetMaterials();
}
function addBudgetMaterial(){
 const name=document.getElementById('bmName').value.trim()||`Material ${budgetMaterials.length+1}`;
 const cost=Number(document.getElementById('bmCost').value),qty=Math.floor(Number(document.getElementById('bmQty').value||1));
 if(!(cost>=0&&qty>0)){alert('Informe custo válido e quantidade maior que zero.');return;}
 budgetMaterials.push({name,cost,qty,total:cost*qty});
 document.getElementById('bmName').value='';document.getElementById('bmCost').value='';document.getElementById('bmQty').value='1';
 renderBudgetMaterials();
}
function removeBudgetMaterial(i){budgetMaterials.splice(i,1);renderBudgetMaterials();}
function renderBudgetMaterials(){
 const el=document.getElementById('budgetMaterialsList');if(!el)return;
 el.innerHTML=budgetMaterials.map((m,i)=>`<div class="meta" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(m.name)}</b> · ${m.qty} × ${brl(m.cost)} = <b>${brl(m.total)}</b> <button class="secondary" onclick="removeBudgetMaterial(${i})">Remover</button></div>`).join('')||'<div class="empty">Nenhum material adicionado.</div>';
}
let lastBudget=null;
function calculateBudget(){
 const material=budgetMaterials.reduce((s,m)=>s+m.total,0),hours=Math.max(0,Number(document.getElementById('bHours').value||0)),hourly=Math.max(0,Number(document.getElementById('bHourly').value||0)),other=Math.max(0,Number(document.getElementById('bOther').value||0));
 const margin=Math.min(95,Math.max(0,Number(document.getElementById('bMargin').value||0)))/100,fees=Math.min(99,Math.max(0,Number(document.getElementById('bFees').value||0)))/100,discount=Math.min(90,Math.max(0,Number(document.getElementById('bDiscount').value||0)))/100;
 const labor=hours*hourly,cost=material+labor+other,denom=1-margin-fees;
 if(denom<=0||discount>=1){alert('Ajuste a margem e as taxas: a soma não pode chegar a 100%.');return;}
 const priceBeforeDiscount=cost/denom,price=priceBeforeDiscount/(1-discount),actualSale=price*(1-discount),feesValue=actualSale*fees,profit=actualSale-cost-feesValue;
 lastBudget={name:document.getElementById('bName').value.trim()||'Orçamento',client:document.getElementById('bClient').value.trim(),material,labor,other,cost,margin:margin*100,fees:fees*100,discount:discount*100,price,actualSale,feesValue,profit,materials:budgetMaterials.map(x=>({...x}))};
 document.getElementById('budgetOutput').innerHTML=`<div class="budget-result"><div class="label">Preço sugerido para informar ao cliente</div><div class="big">${brl(price)}</div><div class="meta">Preço com desconto aplicado: ${brl(actualSale)}</div></div>
 <div class="stats"><div class="stat"><div class="label">Materiais</div><div class="value">${brl(material)}</div></div><div class="stat"><div class="label">Mão de obra</div><div class="value">${brl(labor)}</div></div><div class="stat"><div class="label">Custo total</div><div class="value redtext">${brl(cost)}</div></div><div class="stat"><div class="label">Lucro estimado</div><div class="value goldtext">${brl(profit)}</div></div></div>
 <div class="card"><div class="meta">Outros custos: ${brl(other)} · Taxas estimadas: ${brl(feesValue)} · Margem desejada: ${margin*100}% · Desconto: ${discount*100}%</div></div>
 <p class="small">Fórmula: preço-base = custo total ÷ (1 − margem − taxas). O desconto é aplicado sobre o preço informado. É uma estimativa: inclua energia, desgaste de ferramentas, perdas de MDF e impostos reais em “Outros custos”/taxas.</p>`;
}
function saveBudgetAsOrder(){
 if(!lastBudget){calculateBudget();if(!lastBudget)return;}
 const b=lastBudget;
 const data={number:Date.now().toString().slice(-6),client:b.client||'A definir',product:b.name,price:b.price,cost:b.cost,paid:0,status:'Orçamento',created:new Date().toISOString().slice(0,10),notes:`Orçamento: materiais ${brl(b.material)}, mão de obra ${brl(b.labor)}, outros custos ${brl(b.other)}, lucro estimado ${brl(b.profit)}. Materiais: ${b.materials.map(m=>`${m.name} (${m.qty} × ${brl(m.cost)})`).join('; ')}`};
 try {
  let arr=JSON.parse(localStorage.getItem('imperio_orders')||'[]');
  if(!Array.isArray(arr))arr=[];
  arr.unshift(data);localStorage.setItem('imperio_orders',JSON.stringify(arr));
  alert('Orçamento salvo como pedido. Confira na aba Pedidos.');
  setTab('pedidos');
 }catch(e){alert('Não foi possível salvar automaticamente. Copie os valores do orçamento antes de sair.');}
}

function printQuote(){if(!document.getElementById('quoteForm').reportValidity())return;if(!quoteItems.length){alert('Adicione itens antes de imprimir.');return;}const f=quoteFormData(),subtotal=quoteSum(),discount=Math.max(0,Number(f.discount||0)),total=Math.max(0,subtotal-discount);const rows=quoteItems.map(x=>`<tr><td>${esc(x.category)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${brl(x.price)}</td><td>${brl(x.qty*x.price)}</td></tr>`).join('');const w=window.open('','_blank');if(!w){alert('Permita pop-ups para imprimir o orçamento.');return;}w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Orçamento ${esc(f.number)}</title><style>body{font:14px Arial,sans-serif;color:#222;max-width:850px;margin:30px auto;padding:0 20px}header{border-bottom:3px solid #d7ad55;padding-bottom:15px}h1{margin:0;color:#a51f2b}small{color:#555}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left}th{background:#f3f3f3}.total{text-align:right;font-size:22px;font-weight:bold;margin-top:20px}.foot{margin-top:30px;color:#555}</style><header style="display:flex;align-items:center;gap:18px"><img src="${LOGO_DATA}" alt="Logo Império Art Sound" style="width:150px;max-height:120px;object-fit:contain;background:#000;border-radius:8px"><div><h1>IMPÉRIO ART SOUND</h1><b>ORÇAMENTO ${esc(f.number)}</b><br><small>Data: ${fmtDate(f.date)} · Validade: ${esc(f.validity||7)} dias</small></div></header><p><b>Cliente:</b> ${esc(f.client)} ${f.city?'· '+esc(f.city):''}<br><b>Projeto:</b> ${esc(f.project||'Som automotivo personalizado')}</p><table><thead><tr><th>Categoria</th><th>Descrição</th><th>Qtd.</th><th>Unitário</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table><p style="text-align:right">Subtotal: ${brl(subtotal)}<br>Desconto: ${brl(discount)}</p><div class="total">TOTAL: ${brl(total)}</div><p><b>Pagamento:</b> ${esc(f.paymentTerms||'A combinar')}<br><b>Prazo:</b> ${esc(f.delivery||'A combinar')}</p>${f.notes?`<p><b>Observações:</b> ${esc(f.notes)}</p>`:''}<div class="foot">Obrigado pela preferência!<br>IMPÉRIO ART SOUND</div><script>window.onload=()=>window.print()<\/script></html>`);w.document.close();}

function renderCharts(){
 const os=orders(), allExpenses=expenses(), ex=allExpenses.filter(e=>(e.scope||'loja')==='loja'), personalExpenses=allExpenses.filter(e=>e.scope==='pessoal');
 const personalTotal=personalExpenses.reduce((s,e)=>s+Number(e.amount||0),0);
 const expenseTotal=ex.reduce((s,e)=>s+Number(e.amount||0),0);
 const revenue=os.reduce((s,o)=>s+Number(o.price||0),0);
 const receivedTotal=os.reduce((s,o)=>s+received(o),0);
 const costTotal=os.reduce((s,o)=>s+costs(o),0);
 const estimated=revenue-costTotal-expenseTotal;
 const catMap={}; ex.forEach(e=>{const c=e.category||'Outros';catMap[c]=(catMap[c]||0)+Number(e.amount||0);});
 const catEntries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
 const maxCat=Math.max(1,...catEntries.map(x=>x[1]));
 const monthNames=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
 const months=[];
 const now=new Date();
 for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months.push({key,label:monthNames[d.getMonth()],sales:0,expenses:0});}
 const monthMap=Object.fromEntries(months.map(m=>[m.key,m]));
 os.forEach(o=>{const key=String(o.created||o.due||'').slice(0,7);if(monthMap[key])monthMap[key].sales+=Number(o.price||0);});
 ex.forEach(e=>{const key=String(e.date||e.created||'').slice(0,7);if(monthMap[key])monthMap[key].expenses+=Number(e.amount||0);});
 const maxMonth=Math.max(1,...months.flatMap(m=>[m.sales,m.expenses]));
 const chartMonths=months.map(m=>`<div class="month-col"><div class="month-bars"><div class="month-bar" title="Vendas ${brl(m.sales)}" style="height:${Math.max(m.sales?3:0,m.sales/maxMonth*130)}px;background:#d7ad55"></div><div class="month-bar" title="Despesas ${brl(m.expenses)}" style="height:${Math.max(m.expenses?3:0,m.expenses/maxMonth*130)}px;background:#e32636"></div></div><div class="month-label">${m.label}</div></div>`).join('');
 const categoryBars=catEntries.map(([name,value])=>`<div class="chart-row"><div>${esc(name)}</div><div class="chart-track"><div class="chart-fill" style="width:${value/maxCat*100}%;background:${name==='Material'?'#d7ad55':'#e32636'}"></div></div><div style="text-align:right">${brl(value)}</div></div>`).join('')||'<div class="empty">Registre despesas para visualizar os gastos por categoria.</div>';
 const orderRows=os.slice(0,12).map(o=>{const price=Number(o.price||0),cost=costs(o),margin=price-cost;const pct=price?Math.max(0,Math.min(100,cost/price*100)):0;return `<div class="card"><div class="cardtop"><div><b>#${esc(o.number)} · ${esc(o.client||'Cliente')}</b><div class="meta">Orçamento: ${brl(price)} · Custo informado: ${brl(cost)}</div></div><div class="money">${brl(margin)}</div></div><div class="chart-track" style="margin-top:10px"><div class="chart-fill" title="Custo" style="width:${pct}%;background:#e32636"></div></div><div class="meta">Vermelho = custo informado; restante = diferença antes das despesas gerais.</div></div>`;}).join('')||'<div class="empty">Cadastre pedidos para comparar orçamento e custo.</div>';
 app.innerHTML=`<h2>Gráficos e análise financeira</h2>
 <div class="stats"><div class="stat"><div class="label">Despesas da loja</div><div class="value goldtext">${brl(expenseTotal)}</div></div><div class="stat"><div class="label">Despesas pessoais</div><div class="value redtext">${brl(personalTotal)}</div></div>
 <div class="stat"><div class="label">Orçamentos / vendas</div><div class="value">${brl(revenue)}</div></div>
 <div class="stat"><div class="label">Custos informados nos pedidos</div><div class="value redtext">${brl(costTotal)}</div></div>
 <div class="stat"><div class="label">Despesas gerais</div><div class="value">${brl(expenseTotal)}</div></div>
 <div class="stat"><div class="label">Resultado estimado</div><div class="value goldtext">${brl(estimated)}</div></div></div>
 <div class="card section"><h3>Vendas x despesas — últimos 6 meses</h3><div class="chart-legend"><span><i class="dot" style="background:#d7ad55"></i>Orçamentos de pedidos</span><span><i class="dot" style="background:#e32636"></i>Despesas lançadas</span></div><div class="chart-month">${chartMonths}</div><p class="small">As vendas são agrupadas pela data de criação do pedido; as despesas, pela data registrada. Valores sem data podem não entrar no gráfico.</p></div>
 <div class="card section"><h3>Gastos por categoria</h3><p class="small">Para analisar materiais, registre compras em Despesas e selecione a categoria “Material”.</p>${categoryBars}</div>
 <div class="section"><h3>Orçamento x custo por pedido</h3><p class="small">Diferença estimada = valor do pedido menos custo informado. Não inclui rateio de despesas gerais nesta comparação.</p>${orderRows}</div>
 <button class="secondary" style="width:100%" onclick="setTab('despesas')">＋ Registrar despesa / material</button>`;
}

let cutParts=[];
function renderCutPlanner(){
app.innerHTML=`<h2>Plano de corte MDF</h2>
<div class="formbox section"><h3>1. Defina a chapa</h3><div class="grid2">
<div class="field"><label>Largura da chapa (mm)</label><input id="sheetW" type="number" min="1" value="2750"></div>
<div class="field"><label>Comprimento da chapa (mm)</label><input id="sheetH" type="number" min="1" value="1850"></div>
<div class="field"><label>Espessura MDF (mm)</label><select id="sheetT"><option>6</option><option>15</option><option selected>18</option><option>25</option></select></div>
<div class="field"><label>Perda da serra/fresa (mm)</label><input id="kerf" type="number" min="0" step=".1" value="3"></div>
<div class="field full"><label>Margem nas bordas (mm)</label><input id="margin" type="number" min="0" value="10"></div></div>
<p class="small">Padrão inicial 2750 × 1850 mm, MDF 18 mm, perda de corte 3 mm e margem de 10 mm. Confira as medidas da chapa real.</p></div>
<div class="formbox section"><h3>2. Adicione as peças</h3><div class="grid2">
<div class="field"><label>Nome da peça</label><input id="partName" placeholder="Ex.: lateral"></div>
<div class="field"><label>Quantidade</label><input id="partQty" type="number" min="1" value="2"></div>
<div class="field"><label>Largura (mm)</label><input id="partW" type="number" min="1" placeholder="500"></div>
<div class="field"><label>Comprimento (mm)</label><input id="partH" type="number" min="1" placeholder="400"></div></div>
<div class="row"><button onclick="addCutPart()">Adicionar peça</button><button class="secondary" onclick="clearCutParts()">Limpar peças</button></div><div id="partsList" style="margin-top:12px"></div></div>
<div class="formbox section"><h3>3. Plano e aproveitamento</h3><button class="gold" style="width:100%" onclick="calculateCutPlan()">Calcular plano de corte</button><div id="cutResults" style="margin-top:14px"><div class="empty">Adicione as peças e calcule o plano.</div></div></div>
<p class="small">É uma sugestão de distribuição retangular, não um plano CNC certificado. Confira sentido do veio, esquadro, espessura e ordem de corte antes de cortar.</p>`;
renderCutParts();
}
function addCutPart(){
const name=document.getElementById('partName').value.trim()||`Peça ${cutParts.length+1}`,w=Number(document.getElementById('partW').value),h=Number(document.getElementById('partH').value),qty=Math.floor(Number(document.getElementById('partQty').value));
if(!(w>0&&h>0&&qty>0)){alert('Informe largura, comprimento e quantidade válidos.');return;}
for(let i=0;i<qty;i++)cutParts.push({name,w,h});
document.getElementById('partName').value='';document.getElementById('partW').value='';document.getElementById('partH').value='';renderCutParts();
}
function clearCutParts(){if(confirm('Limpar todas as peças deste plano?')){cutParts=[];renderCutParts();document.getElementById('cutResults').innerHTML='<div class="empty">Adicione as peças e calcule o plano.</div>';}}
function removeCutPart(i){cutParts.splice(i,1);renderCutParts();}
function renderCutParts(){const el=document.getElementById('partsList');if(!el)return;el.innerHTML=cutParts.map((p,i)=>`<div class="meta" style="padding:7px 0;border-bottom:1px solid var(--line)"><b>${esc(p.name)}</b> — ${p.w} × ${p.h} mm <button class="secondary" onclick="removeCutPart(${i})">Remover</button></div>`).join('')||'<div class="small">Nenhuma peça adicionada.</div>';}
function calculateCutPlan(){
const sw=Number(document.getElementById('sheetW').value),sh=Number(document.getElementById('sheetH').value),kerf=Number(document.getElementById('kerf').value||0),margin=Number(document.getElementById('margin').value||0),out=document.getElementById('cutResults');
if(!(sw>0&&sh>0)||!cutParts.length){out.innerHTML='<div class="empty">Informe a chapa e adicione ao menos uma peça.</div>';return;}
const aw=sw-2*margin,ah=sh-2*margin;if(aw<=0||ah<=0){out.innerHTML='<div class="empty">Margem inválida.</div>';return;}
let pieces=cutParts.map((p,idx)=>({...p,idx})).sort((a,b)=>b.w*b.h-a.w*a.h),sheets=[],current={x:0,y:0,rowH:0,items:[]},invalid=[];
function pushSheet(){if(current.items.length)sheets.push(current);current={x:0,y:0,rowH:0,items:[]};}
for(const p of pieces){
let w=p.w,h=p.h,rot=false;
if(w>aw||h>ah){if(h<=aw&&w<=ah){[w,h]=[h,w];rot=true;}else{invalid.push(p);continue;}}
if(current.x+w>aw){current.x=0;current.y+=current.rowH+kerf;current.rowH=0;}
if(current.y+h>ah){pushSheet();}
if(current.x+w>aw){current.x=0;current.y+=current.rowH+kerf;current.rowH=0;}
if(current.y+h>ah){pushSheet();}
if(w>aw||h>ah||current.y+h>ah){invalid.push(p);continue;}
current.items.push({...p,w,h,rot,x:current.x+margin,y:current.y+margin});current.x+=w+kerf;current.rowH=Math.max(current.rowH,h);
}
pushSheet();
const placed=sheets.flatMap(s=>s.items),area=cutParts.reduce((s,p)=>s+p.w*p.h,0),yieldPct=sheets.length?100*area/(sw*sh*sheets.length):0;
const colors=['#e32636','#d7ad55','#4b91d1','#55c58a','#a78bfa','#e879c5','#f97316','#22b8cf'];
const drawings=sheets.map((s,si)=>`<div class="card"><b>Chapa ${si+1}</b><div style="overflow-x:auto;margin-top:8px"><svg viewBox="0 0 ${sw} ${sh}" style="width:100%;min-width:280px;background:#eee;border:1px solid var(--line);height:auto;max-height:460px"><rect width="${sw}" height="${sh}" fill="#e5e7eb"/><rect x="${margin}" y="${margin}" width="${aw}" height="${ah}" fill="#f8fafc" stroke="#555" stroke-dasharray="10 8" stroke-width="3"/>${s.items.map((p,i)=>`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${colors[p.idx%colors.length]}" fill-opacity=".85" stroke="#fff" stroke-width="3"/><text x="${p.x+p.w/2}" y="${p.y+p.h/2-5}" font-size="${Math.max(22,Math.min(48,Math.min(p.w,p.h)/5))}" text-anchor="middle" fill="#111" font-weight="700">${esc(p.name).slice(0,16)}</text><text x="${p.x+p.w/2}" y="${p.y+p.h/2+30}" font-size="${Math.max(18,Math.min(34,Math.min(p.w,p.h)/7))}" text-anchor="middle" fill="#111">${p.w}×${p.h}</text>`).join('')}</svg></div><div class="small">Peças nesta chapa: ${s.items.length}</div></div>`).join('');
out.innerHTML=`<div class="stats"><div class="stat"><div class="label">Peças encaixadas</div><div class="value">${placed.length}/${cutParts.length}</div></div><div class="stat"><div class="label">Chapas estimadas</div><div class="value">${sheets.length}</div></div><div class="stat"><div class="label">Área das peças</div><div class="value">${(area/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})} m²</div></div><div class="stat"><div class="label">Aproveitamento teórico</div><div class="value goldtext">${yieldPct.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</div></div></div><p class="small">Encaixe simples em faixas; não garante o melhor aproveitamento. Percentual por área, sem considerar veio, defeitos ou perdas adicionais.</p>${invalid.length?`<div class="card"><b class="redtext">Peças que não couberam</b><div class="meta">${invalid.map(p=>`${esc(p.name)} — ${p.w} × ${p.h} mm`).join('<br>')}</div></div>`:''}${drawings}`;
}

function renderBackup(){app.innerHTML=`<h2>Dados e segurança</h2><div class="card"><h3>Conta sincronizada</h3><p class="small">Conta: ${esc(currentUser?.email||'')}<br>Os registros são sincronizados com a nuvem. Para maior segurança, faça backup regularmente.</p><button class="secondary" onclick="signOut()">Sair da conta</button></div><div class="card"><h3>Backup completo</h3><p class="small">Exporta pedidos, pagamentos, despesas e anexos em um arquivo JSON. Guarde esse arquivo em local seguro. O backup é uma cópia adicional; não substitui a sincronização.</p><button onclick="exportBackup()">Exportar backup</button></div><div class="card"><h3>Restaurar backup</h3><p class="small">Importar um backup substitui os dados atuais. Exporte o estado atual antes de restaurar.</p><button class="secondary" onclick="document.getElementById('importFile').click()">Escolher arquivo de backup</button></div><div class="card"><h3>Resumo dos dados</h3><div class="meta">Pedidos: ${orders().length}<br>Despesas: ${expenses().length}<br>Anexos: ${orders().reduce((s,o)=>s+(o.photos||[]).length,0)} imagens</div><hr><button class="danger" onclick="clearAll()">Apagar todos os dados</button></div><p class="small">Privacidade: o acesso aos registros depende do login e das regras de segurança do banco. Proteja também o iPhone e o computador com senha.</p>`;
}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'Imperio Art Sound',version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`imperio-art-sound-backup-${dateNow()}.json`;a.click();URL.revokeObjectURL(a.href);}
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.records))throw Error('Arquivo inválido');if(!confirm('Isso substituirá todos os dados atuais. Continuar?'))return;const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE);store.clear();parsed.records.forEach(x=>store.put(x));tx.oncomplete=async()=>{await refresh();alert('Backup restaurado.');};}catch(err){alert('Não foi possível importar: '+err.message)}finally{e.target.value='';}});
async function clearAll(){if(!confirm('ATENÇÃO: apagar permanentemente todos os pedidos, pagamentos, despesas e anexos da nuvem e deste aparelho?'))return;if(!confirm('Confirme novamente: você exportou um backup?'))return;if(currentUser&&supabaseClient){const {error}=await supabaseClient.from('app_records').delete().eq('user_id',currentUser.id);if(error){alert('Não foi possível apagar na nuvem: '+error.message);return;}}const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=async()=>{await refresh();};}
async function signOut(){if(!confirm('Deseja sair da sua conta?'))return;await supabaseClient.auth.signOut();}

(async()=>{try{db=await openDB();if(!window.supabase||!window.APP_CONFIG||!APP_CONFIG.url||!APP_CONFIG.anonKey||APP_CONFIG.url.includes('COLOQUE_')){app.innerHTML='<div class="card"><h2>Configuração necessária</h2><p class="small">O aplicativo precisa ser conectado ao projeto de banco de dados. Siga o arquivo LEIA-ME-NUVEM.txt incluído no pacote e preencha config.js antes de publicar.</p></div>';return;}supabaseClient=window.supabase.createClient(APP_CONFIG.url,APP_CONFIG.anonKey);const {data:{session}}=await supabaseClient.auth.getSession();if(session){currentUser=session.user;await startCloudApp();}else authScreen();supabaseClient.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;if(currentUser){await startCloudApp();}else{if(cloudChannel){await supabaseClient.removeChannel(cloudChannel);cloudChannel=null;}document.querySelector('.nav').style.display='none';authScreen();}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){app.innerHTML='<div class="empty">Não foi possível iniciar o aplicativo: '+esc(e.message||e)+'</div>';}})();
