<style>
:root{
 --bg:#f3f6fa;--surface:#ffffff;--surface-2:#f8fafc;--text:#172435;--muted:#68788b;
 --line:#dce4ec;--nav:#142235;--nav-2:#1b2d43;--accent:#087f8c;--accent-2:#0b6570;
 --accent-soft:#e4f4f4;--gold:#b7791f;--gold-soft:#fff4dc;--green:#16845b;
 --red:#c2414d;--purple:#7056a8;--shadow:0 8px 24px rgba(22,42,64,.07);

}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 0 28px 252px;min-height:100vh}
header{height:76px;padding:10px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:12;box-shadow:0 2px 10px rgba(20,34,53,.04)}
.brand{height:100%;display:flex;align-items:center;gap:13px;font-weight:850;letter-spacing:.2px;font-size:19px;color:#172435}
.brand span{color:var(--accent)}
.brand-logo{width:54px;height:54px;object-fit:contain;border-radius:11px;background:#101827;border:1px solid #e5eaf0;padding:2px}
.sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.1px;margin-top:1px}
main{max-width:1440px;margin:0 auto;padding:28px 30px 48px}
h2{font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.35px;color:#15283d;margin:0 0 18px}
h3{font-size:15px;line-height:1.35;font-weight:750;color:#23384e;margin:0 0 12px}
p{line-height:1.55}
.nav{position:fixed;left:0;top:0;bottom:0;width:252px;z-index:20;display:flex;flex-direction:column;align-items:stretch;gap:5px;overflow-y:auto;overflow-x:hidden;white-space:normal;background:var(--nav);border-right:1px solid #26384c;padding:20px 13px 24px;box-shadow:4px 0 18px rgba(14,28,45,.08)}
.nav:before{content:"MENU PRINCIPAL";display:block;color:#8fa2b8;font-size:10px;font-weight:800;letter-spacing:1.35px;padding:8px 12px 12px}
.nav-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.nav-label{padding:8px 12px 5px;color:#8195ab;font-size:10px;font-weight:800;letter-spacing:1.15px;text-transform:uppercase}
.nav button{width:100%;min-height:42px;display:flex;align-items:center;gap:12px;text-align:left;flex:0 0 auto;padding:9px 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:#c3d0de;font-size:13px;font-weight:600;box-shadow:none;white-space:normal;line-height:1.25}
.nav button b{width:22px;flex:0 0 22px;text-align:center;font-size:17px;line-height:1;color:#91a7bd;margin:0}
.nav button:hover{background:#20354c;color:#fff}
.nav button.active{background:#0b6570;border-color:#178c96;color:#fff;box-shadow:0 4px 12px #061d2c55}
.nav button.active b{color:#fff}
button,.button{border:1px solid var(--accent);border-radius:9px;padding:10px 15px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 5px rgba(8,127,140,.14);transition:background .15s,border-color .15s,transform .15s}
button:hover,.button:hover{background:var(--accent-2);border-color:var(--accent-2)}
button:active{transform:translateY(1px)}
button.secondary{background:#fff;color:#38516a;border:1px solid #cbd6e1;box-shadow:none}
button.secondary:hover{background:#f0f5f8;border-color:#9fb1c2}
button.gold{background:#d79b32;border-color:#c58a25;color:#fff;box-shadow:none}
button.gold:hover{background:#bd8120}
button.danger{background:#c2414d;border-color:#b43b46;color:#fff}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat,.card,.formbox,.budget-result{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow)}
.stat{border-top:3px solid #b9cbd6}
.stat:nth-child(4n+1){border-top-color:#087f8c}
.stat:nth-child(4n+2){border-top-color:#537ca5}
.stat:nth-child(4n+3){border-top-color:#b7791f}
.stat:nth-child(4n){border-top-color:#7056a8}
.stat .label{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.25px;text-transform:uppercase}
.stat .value{font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.5px;color:#1c3045;margin-top:7px;overflow-wrap:anywhere}
.goldtext,.money{color:var(--gold)}.green{color:var(--green)}.redtext{color:var(--red)}
.field{margin-bottom:13px;min-width:0}
.field label{display:block;color:#42566b;font-size:12px;font-weight:700;margin:0 0 6px}
.field input,.field select,.field textarea,.toolbar input,.cost-line input{width:100%;min-width:0;background:#fff;color:#203246;border:1px solid #cbd6e1;border-radius:8px;padding:11px 12px;font:inherit;outline:none;box-shadow:inset 0 1px 2px rgba(22,42,64,.025)}
.field textarea{min-height:86px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:#1595a0;box-shadow:0 0 0 3px rgba(8,127,140,.12)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}.hidden{display:none!important}
.card{margin-bottom:12px}.cardtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cardtitle{font-size:15px;font-weight:800;color:#21364c}
.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.55}
.money{font-weight:800;white-space:nowrap}
.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:20px;background:#edf2f6;color:#53677b;font-size:11px;font-weight:700;margin-top:8px;border:1px solid #dce4ec}
.badge.pronto,.badge.entregue{background:#e7f6ef;color:#16734f;border-color:#bce7d1}
.badge.producao{background:#fff4dc;color:#95600d;border-color:#f1d69b}
.badge.pendente{background:#fff0f1;color:#b33d49;border-color:#f0c5ca}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.actions button{padding:8px 11px;font-size:12px}
.empty{padding:30px 16px;text-align:center;color:#718397;background:#fff;border:1px dashed #cbd6e1;border-radius:12px}
.toolbar{display:flex;gap:9px;margin-bottom:14px}
.toolbar input{flex:1}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin:4px 5px 0 0}
.small{font-size:12px;color:var(--muted);line-height:1.55}
.section{margin-bottom:22px}
.formbox h3,.card h3{padding-bottom:10px;border-bottom:1px solid #e5ebf0;margin-bottom:15px}
.cost-line{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:8px;align-items:center;margin:8px 0}
.budget-result{border:1px solid #b8dfe0;background:linear-gradient(135deg,#f2fbfb,#fff)}
.budget-result .big{font-size:27px;font-weight:850;color:var(--accent)}
.chart-row{display:grid;grid-template-columns:90px 1fr 78px;gap:8px;align-items:center;margin:10px 0;font-size:12px}
.chart-track{height:14px;background:#e9eef3;border-radius:20px;overflow:hidden}
.chart-fill{height:100%;border-radius:20px;min-width:0}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.chart-month{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:170px;padding:10px 0}
.month-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.month-bars{height:135px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.month-bar{width:38%;max-width:20px;border-radius:4px 4px 0 0;min-height:2px}
.month-label{font-size:10px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#app>h2:first-child{display:flex;align-items:center;gap:10px}
#app>h2:first-child:after{content:"";height:3px;width:38px;border-radius:5px;background:var(--accent);display:inline-block}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){body{padding-left:0;padding-bottom:88px}header{height:68px;padding:8px 14px}main{padding:20px 16px 34px}.nav{top:auto;right:0;bottom:0;width:100%;height:78px;flex-direction:row;align-items:stretch;gap:6px;overflow-x:auto;overflow-y:hidden;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid #d8e1e9;background:#142235;box-shadow:0 -5px 20px #15283d22}.nav:before{display:none}.nav-group{display:contents}.nav-label{display:none}.nav button{width:86px;min-width:86px;min-height:60px;height:60px;flex:0 0 86px;flex-direction:column;justify-content:center;gap:4px;text-align:center;padding:5px 4px;font-size:10px;border-radius:9px}.nav button b{width:auto;flex:auto;font-size:18px}.nav button.active{background:#0b6570}}
@media(max-width:560px){main{padding:16px 11px 28px}.brand-logo{width:48px;height:48px}.brand{font-size:16px}.sub{font-size:10px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat,.card,.formbox,.budget-result{padding:13px;border-radius:11px}.stat .value{font-size:20px}.grid2{gap:8px}.field input,.field select,.field textarea{padding:10px}.row{gap:7px}.row button{padding:10px 8px}.toolbar{flex-wrap:wrap}.toolbar select{max-width:100%!important}.chart-row{grid-template-columns:70px 1fr 65px}.cost-line{grid-template-columns:minmax(0,1fr) 75px 36px}}
.print-only{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff!important;color:#111!important;padding:0!important}
 body *{visibility:hidden!important}
 #cutResults,#cutResults *{visibility:visible!important}
 #cutResults{position:absolute!important;left:0!important;top:0!important;width:100%!important;margin:0!important;color:#111!important;background:#fff!important}
 #cutResults .print-only{display:block!important}
 #cutResults .card,#cutResults .stat{background:#fff!important;color:#111!important;border:1px solid #999!important;box-shadow:none!important;break-inside:avoid}
 #cutResults .stats{display:grid!important;grid-template-columns:repeat(4,1fr)!important}
 #cutResults svg{max-height:150mm!important;min-width:0!important;width:auto!important;max-width:100%!important}
 #cutResults .small,#cutResults p{color:#333!important}
 #cutResults .no-print{display:none!important}
}

/* v10: identidade vermelha e valores financeiros por natureza */
:root{--accent:#c62838;--accent-2:#a91f2d;--accent-soft:#fdecef;--nav:#20232b;--nav-2:#2a2e38}
.nav{background:#20232b;border-right-color:#343944}
.nav button:hover{background:#343944}

button{background:#c62838;border-color:#c62838;box-shadow:0 2px 5px rgba(198,40,56,.16)}

.project-preview{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:14px;align-items:start}

const dateNow=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function allRecords(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}
function putLocal(x){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});}
function delLocal(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});}
async function putRecord(x){await putLocal(x);if(currentUser&&supabaseClient){const {error}=await supabaseClient.from('app_records').upsert({user_id:currentUser.id,record_id:String(x.id),data:x},{onConflict:'user_id,record_id'});if(error)alert('Salvo neste aparelho, mas a nuvem não foi atualizada: '+error.message);} }
async function delRecord(id){await delLocal(id);if(currentUser&&supabaseClient){const {error}=await supabaseClient.from('app_records').delete().eq('user_id',currentUser.id).eq('record_id',String(id));if(error)alert('Excluído neste aparelho, mas não na nuvem: '+error.message);} }
async function refresh(){records=await allRecords();render();}
async function syncFromCloud(){
 if(!currentUser||!supabaseClient||syncBusy)return;
 syncBusy=true;
 try{
  // Nunca limpar o IndexedDB durante uma sincronização: uma resposta vazia/incompleta
  // da nuvem não pode apagar pedidos, despesas ou projetos deste aparelho.
  const localBefore=await allRecords();
  const {data,error}=await supabaseClient.from('app_records').select('record_id,data').eq('user_id',currentUser.id);
  if(error)throw error;
  const cloudRows=Array.isArray(data)?data:[];
  const cloudRecords=cloudRows.map(row=>row&&row.data).filter(x=>x&&x.id!==undefined&&x.id!==null);
  const cloudIds=new Set(cloudRecords.map(x=>String(x.id)));
  // Mescla por ID: registros remotos atualizam os correspondentes, enquanto
  // registros locais ausentes na resposta permanecem intactos.
  for(const remote of cloudRecords) await putLocal(remote);
  // Recupera na nuvem registros locais que não estavam nela (inclusive quando
  // a consulta retorna zero linhas), sem excluir nenhum registro existente.
  const missingLocal=localBefore.filter(x=>x&&x.id!==undefined&&!cloudIds.has(String(x.id)));
  for(const local of missingLocal){
   const {error:upsertError}=await supabaseClient.from('app_records').upsert({user_id:currentUser.id,record_id:String(local.id),data:local},{onConflict:'user_id,record_id'});
   if(upsertError)throw upsertError;
  }
  await refresh();
 }catch(e){
  console.error(e);
  await refresh();
  app.insertAdjacentHTML('afterbegin','<div class="card"><h2>Sincronização pendente</h2><p class="small">Seus dados locais foram preservados. Confira a conexão e tente sincronizar novamente.</p><p class="small">'+esc(e.message||e)+'</p><button onclick="syncFromCloud()">Tentar novamente</button></div>');
 }finally{syncBusy=false;}
}
function scheduleCloudSync(){if(syncTimer)clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncFromCloud(),600);}

async function signUp(){const form=document.getElementById('authForm');if(!form.reportValidity())return;const f=new FormData(form);const {data,error}=await supabaseClient.auth.signUp({email:f.get('email'),password:f.get('password')});if(error)authScreen(error.message);else authScreen(data.session?'Conta criada. Entrando…':'Conta criada. Confira seu e-mail para confirmar o cadastro e depois entre.');}
async function startCloudApp(){document.querySelector('.nav').style.display='flex';await syncFromCloud();if(!cloudChannel){cloudChannel=supabaseClient.channel('app-records-'+currentUser.id).on('postgres_changes',{event:'*',schema:'public',table:'app_records',filter:'user_id=eq.'+currentUser.id},()=>scheduleCloudSync()).subscribe();}window.addEventListener('focus',scheduleCloudSync);}

function orders(){return records.filter(x=>x.kind==='order').sort((a,b)=>(b.created||'').localeCompare(a.created||''));}
function expenses(){return records.filter(x=>x.kind==='expense').sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function received(o){return (o.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);}
function costs(o){return Number(o.cost||0);}
function balance(o){return Number(o.price||0)-received(o);}
function profit(o){return Number(o.price||0)-costs(o);}
function fmtDate(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`;}
function statusClass(s){return ({'Pronto':'pronto','Entregue':'entregue','Em produção':'producao','Aguardando':'pendente'})[s]||'';}
function orderCard(o){return `<div class="card"><div class="cardtop"><div><div class="cardtitle">#${esc(o.number||'—')} · ${esc(o.client||'Sem nome')}</div><div class="meta">${esc(o.type||'Caixa personalizada')} • Entrega: ${fmtDate(o.due)}<br>${esc(o.city||'')}</div><span class="badge ${statusClass(o.status)}">${esc(o.status||'Aguardando')}</span></div><div class="money green">${brl(o.price)}</div></div><div class="meta">Recebido: <b class="financial-in">${brl(received(o))}</b> · Falta: <b class="financial-in">${brl(balance(o))}</b></div>${o.photos?.length?`<div>${o.photos.map(p=>`<img class="thumb" src="${p.data}" alt="Anexo">`).join('')}</div>`:''}<div class="actions"><button class="secondary" onclick="viewOrder('${o.id}')">Detalhes</button><button class="secondary" onclick="editOrder('${o.id}')">Editar</button><button class="secondary" onclick="addPayment('${o.id}')">＋ Pagamento</button><button class="secondary" onclick="advanceStatus('${o.id}')">Mudar status</button></div></div>`;}

async function resizeImage(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve({name:file.name,data:c.toDataURL('image/jpeg',.78)});};img.onerror=()=>resolve({name:file.name,data:reader.result});img.src=reader.result;};reader.readAsDataURL(file);});}
function renderPhotoPreview(){document.getElementById('photoPreview').innerHTML=window._formPhotos.map((p,i)=>`<span><img class="thumb" src="${p.data}"><button type="button" class="secondary" onclick="removePhoto(${i})">Remover</button></span>`).join('');}
function removePhoto(i){window._formPhotos.splice(i,1);renderPhotoPreview();}
function addPaymentForm(){const amount=Number(document.getElementById('payAmount').value);if(!(amount>0)){alert('Informe um valor válido.');return;}window._formPayments.push({amount,date:dateNow(),method:document.getElementById('payMethod').value});document.getElementById('payAmount').value='';renderPaymentsForm();updateCalc();}
function removePaymentForm(i){window._formPayments.splice(i,1);renderPaymentsForm();updateCalc();}
function renderPaymentsForm(){document.getElementById('paymentsList').innerHTML=window._formPayments.map((p,i)=>`<div class="meta">${fmtDate(p.date)} · ${brl(p.amount)} · ${esc(p.method||'Não informado')} <button type="button" class="secondary" onclick="removePaymentForm(${i})">Remover</button></div>`).join('')||'<div class="small">Nenhum pagamento lançado.</div>';}
function updateCalc(){const f=document.getElementById('orderForm');if(!f)return;const price=Number(f.elements.price.value||0),cost=Number(f.elements.cost.value||0),paid=window._formPayments.reduce((s,p)=>s+Number(p.amount||0),0);document.getElementById('calcInfo').textContent=`Recebido: ${brl(paid)} · Saldo: ${brl(price-paid)} · Lucro estimado neste pedido: ${brl(price-cost)}`;}
async function saveOrder(e){e.preventDefault();const f=e.target,old=editing?records.find(x=>x.id===editing):null;const data=Object.fromEntries(new FormData(f).entries());const number=old?.number||String(Math.max(0,...orders().map(o=>Number(o.number)||0))+1).padStart(4,'0');const o={...(old||{}),...data,id:old?.id||crypto.randomUUID(),kind:'order',number,created:old?.created||new Date().toISOString(),price:Number(data.price||0),cost:Number(data.cost||0),payments:window._formPayments,photos:window._formPhotos};await putRecord(o);editing=null;window._formPhotos=[];window._formPayments=[];await refresh();tab='pedidos';render();alert('Pedido salvo neste aparelho. Faça backup regularmente em Dados.');}
function viewOrder(id){const o=orders().find(x=>x.id===id);if(!o)return;alert(`PEDIDO #${o.number}\nCliente: ${o.client}\nTelefone: ${o.phone||'—'}\nCidade: ${o.city||'—'}\nProjeto: ${o.type}\nMedidas: ${o.measurements||'—'}\nDescrição: ${o.description||'—'}\nEntrega: ${fmtDate(o.due)}\nStatus: ${o.status}\nValor: ${brl(o.price)}\nRecebido: ${brl(received(o))}\nSaldo: ${brl(balance(o))}\nCusto: ${brl(o.cost)}\nLucro estimado: ${brl(profit(o))}`);}
function editOrder(id){const o=orders().find(x=>x.id===id);if(o){tab='novo';renderOrderForm(o);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='novo'));}}
async function addPayment(id){const o=orders().find(x=>x.id===id);if(!o)return;const raw=prompt(`Saldo atual: ${brl(balance(o))}\nDigite o valor recebido (R$):`);if(raw===null)return;const amount=Number(raw.replace(',','.'));if(!(amount>0)){alert('Valor inválido.');return;}const method=prompt('Forma de pagamento (Pix, dinheiro, cartão etc.):','Pix')||'Não informado';o.payments=o.payments||[];o.payments.push({amount,date:dateNow(),method});await putRecord(o);await refresh();}
async function advanceStatus(id){const o=orders().find(x=>x.id===id);if(!o)return;const list=['Aguardando','Em produção','Pronto','Entregue'];const next=list[(list.indexOf(o.status)+1)%list.length];if(confirm(`Alterar status de "${o.status}" para "${next}"?`)){o.status=next;await putRecord(o);await refresh();}}
function renderExpenses(scope='loja'){
 const all=expenses(); const selected=all.filter(e=>(e.scope||'loja')===scope);
 const isPersonal=scope==='pessoal';
 const cats=isPersonal?['Alimentação','Moradia/contas','Transporte','Saúde','Filhos/família','Lazer','Dívidas','Outros']:['Material','Ferramentas','Energia/água','Frete','Manutenção','Equipamentos','Taxas','Outros'];
 const today=dateNow();
 const cashRec=records.find(x=>x.kind==='cash_balance'&&(x.scope||'loja')===scope);
 const cash=Number(cashRec?.amount||0);
 const targetId='forecastDate';
 const previousTarget=document.getElementById(targetId)?.value;
 const target=(previousTarget && previousTarget>=today)?previousTarget:today;
 const unpaid=selected.filter(e=>e.status==='pendente' && e.dueDate && e.dueDate<=target);
 const bills=unpaid.reduce((sum,e)=>sum+Number(e.amount||0),0);
 const incomingOrders=scope==='loja'?orders().filter(o=>balance(o)>0&&o.due&&o.due>=today&&o.due<=target):[];
 const grossIncoming=incomingOrders.reduce((sum,o)=>sum+balance(o),0);
 const confidence=Math.max(0,Math.min(100,Number(document.getElementById('forecastConfidence')?.value??70)))/100;
 const expectedIncoming=grossIncoming*confidence;
 const projected=cash+expectedIncoming-bills;
 const shortfall=Math.max(0,-projected);
 const margin=Math.max(1,Math.min(100,Number(document.getElementById('forecastMargin')?.value??30)))/100;
 const salesNeeded=shortfall/margin;
 const total=selected.reduce((sum,e)=>sum+Number(e.amount||0),0);
 const sorted=[...selected].sort((a,b)=>(a.dueDate||a.date||'9999').localeCompare(b.dueDate||b.date||'9999'));
 app.innerHTML=`<h2>Financeiro — ${isPersonal?'Pessoal':'Loja'}</h2><p class="small">Os caixas são independentes. Informe o dinheiro disponível hoje e as contas com vencimento. A previsão usa recebimentos pendentes dos pedidos e uma margem de confiança que você pode ajustar; não é garantia de recebimento.</p>
 <div class="row" style="margin-bottom:14px"><button class="${!isPersonal?'':'secondary'}" onclick="renderExpenses('loja')">🏪 Caixa da loja</button><button class="${isPersonal?'':'secondary'}" onclick="renderExpenses('pessoal')">👤 Caixa pessoal</button></div>
 <div class="formbox section"><h3>1. Dinheiro disponível agora</h3><form id="cashForm"><div class="grid2"><div class="field"><label>Saldo atual em caixa/conta (R$)</label><input name="amount" type="number" min="0" step="0.01" value="${cash}" required></div><div class="field"><label>Data de referência</label><input value="${today}" disabled></div></div><button type="submit">Salvar saldo disponível</button></form></div>
 <div class="formbox section"><h3>2. Previsão até o vencimento</h3><div class="grid2"><div class="field"><label>Calcular até a data</label><input id="forecastDate" type="date" min="${today}" value="${target}" onchange="renderExpenses('${scope}')"></div><div class="field"><label>Confiança nos recebimentos (%)</label><input id="forecastConfidence" type="number" min="0" max="100" value="${Math.round(confidence*100)}" onchange="renderExpenses('${scope}')"></div><div class="field"><label>Margem líquida estimada das vendas (%)</label><input id="forecastMargin" type="number" min="1" max="100" value="${Math.round(margin*100)}" onchange="renderExpenses('${scope}')"></div></div><button type="button" class="secondary" onclick="renderExpenses('${scope}')">Atualizar cálculo</button>
 <div class="stats"><div class="stat"><div class="label">Dinheiro disponível</div><div class="value">${brl(cash)}</div></div><div class="stat"><div class="label">Contas não pagas até ${fmtDate(target)}</div><div class="value redtext">${brl(bills)}</div></div><div class="stat"><div class="label">A receber bruto de pedidos</div><div class="value">${brl(grossIncoming)}</div></div><div class="stat"><div class="label">Entrada estimada (${Math.round(confidence*100)}%)</div><div class="value">${brl(expectedIncoming)}</div></div><div class="stat"><div class="label">Saldo projetado</div><div class="value ${projected<0?'redtext':'goldtext'}">${brl(projected)}</div></div><div class="stat"><div class="label">Faturamento adicional estimado necessário</div><div class="value ${shortfall>0?'redtext':'goldtext'}">${brl(salesNeeded)}</div></div></div>
 <p><b>${projected>=0?'Pela estimativa, o saldo cobre as contas selecionadas.':'Pela estimativa, faltará dinheiro para quitar todas as contas.'}</b> ${shortfall>0?`A diferença de caixa é ${brl(shortfall)}. Com margem líquida de ${Math.round(margin*100)}%, o faturamento adicional estimado seria ${brl(salesNeeded)}.`:'Não há déficit projetado para esse período, considerando os valores e a confiança informados.'}</p><p class="small">A previsão considera contas pendentes com vencimento até a data selecionada e pedidos da loja com saldo a receber e entrega entre hoje e essa data. Se a data selecionada estiver no passado, o cálculo volta para hoje. O percentual de confiança reduz o valor esperado. Para não contar dinheiro duas vezes, atualize o saldo em caixa depois de receber pagamentos. O faturamento necessário é estimado pela margem líquida, não pelo valor total das contas.</p></div>
 <div class="formbox section"><h3>3. Adicionar conta a pagar — ${isPersonal?'Pessoal':'Loja'}</h3><form id="expenseForm"><div class="grid2"><div class="field"><label>Descrição *</label><input name="description" required placeholder="${isPersonal?'Ex.: aluguel, mercado':'Ex.: MDF, energia, fornecedor'}"></div><div class="field"><label>Valor (R$) *</label><input name="amount" required type="number" min=".01" step=".01" placeholder="0,00"></div><div class="field"><label>Data de lançamento</label><input name="date" type="date" value="${today}"></div><div class="field"><label>Data de vencimento *</label><input name="dueDate" type="date" value="${today}" required></div><div class="field"><label>Categoria</label><select name="category">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Situação</label><select name="status"><option value="pendente">A vencer</option><option value="paga">Já paga</option></select></div><div class="field full"><label>Observações</label><input name="notes" placeholder="Opcional"></div></div><button type="submit">＋ Salvar conta a pagar</button></form></div>
 <div class="section"><h3>4. Contas registradas · Total lançado ${brl(total)}</h3>${sorted.map(e=>{const due=e.dueDate||e.date;const legacy=!e.status;const overdue=e.status==='pendente'&&due&&due<today;const near=e.status==='pendente'&&due&&due>=today&&due<=new Date(Date.now()+3*86400000).toISOString().slice(0,10);return `<div class="card"><div class="cardtop"><div><b>${esc(e.description)}</b><div class="meta">Lançada: ${fmtDate(e.date)} · Vence: ${fmtDate(due)} · ${esc(e.category||'Outros')}</div><span class="badge ${e.status==='paga'||legacy?'entregue':overdue?'pendente':''}">${e.status==='paga'?'Paga':legacy?'Registro antigo':overdue?'VENCIDA':near?'Vence em até 3 dias':'A vencer'}</span></div><div class="money redtext">${brl(e.amount)}</div></div>${e.notes?`<p class="small">${esc(e.notes)}</p>`:''}<div class="actions">${e.status==='paga'?'':`<button class="secondary" onclick="markExpensePaid('${e.id}')">Marcar como paga</button>`}<button class="danger" onclick="deleteExpense('${e.id}')">Excluir</button></div></div>`;}).join('')||'<div class="empty">Nenhuma conta cadastrada nesta área.</div>'}</div>`;
 document.getElementById('cashForm').addEventListener('submit',async e=>{e.preventDefault();const amount=Number(new FormData(e.target).get('amount'));const old=records.find(x=>x.kind==='cash_balance'&&(x.scope||'loja')===scope);await putRecord({id:old?.id||'cash-balance-'+scope,kind:'cash_balance',scope,amount,updated:new Date().toISOString()});await refresh();renderExpenses(scope);alert('Saldo disponível salvo.');});
 document.getElementById('expenseForm').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());await putRecord({...d,id:crypto.randomUUID(),kind:'expense',scope,amount:Number(d.amount),created:new Date().toISOString()});await refresh();renderExpenses(scope);alert('Conta salva no financeiro.');});
}
async function markExpensePaid(id){const e=expenses().find(x=>x.id===id);if(!e)return;e.status='paga';e.paidDate=dateNow();await putRecord(e);await refresh();renderExpenses(e.scope||'loja');}
async function deleteExpense(id){if(confirm('Excluir esta despesa?')){await delRecord(id);await refresh();}}

 const ins=all.filter(x=>x.direction==='entrada'), outs=all.filter(x=>x.direction==='saida');
 const qtyIn=ins.reduce((s,x)=>s+Number(x.quantity||0),0), qtyOut=outs.reduce((s,x)=>s+Number(x.quantity||0),0);

 <div class="field"><label>Tipo *</label><select name="category">${categories.map(c=>`<option>${c}</option>`).join('')}</select></div>

let budgetMaterials=[];
function renderBudget(){
 app.innerHTML=`<h2>Orçamento e preço de venda</h2>
 <p class="small">Calcule o custo de material, mão de obra, despesas indiretas e margem desejada antes de passar o preço ao cliente.</p>
 <div class="formbox section"><h3>1. Dados do orçamento</h3><div class="grid2">
 <div class="field"><label>Nome do orçamento / produto</label><input id="bName" placeholder="Ex.: caixa de grave"></div>
 <div class="field"><label>Cliente (opcional)</label><input id="bClient" placeholder="Nome do cliente"></div>
 <div class="field"><label>Horas de trabalho</label><input id="bHours" type="number" min="0" step=".5" value="0"></div>

function addBudgetMaterial(){
 const name=document.getElementById('bmName').value.trim()||`Material ${budgetMaterials.length+1}`;
 const cost=Number(document.getElementById('bmCost').value),qty=Math.floor(Number(document.getElementById('bmQty').value||1));
 if(!(cost>=0&&qty>0)){alert('Informe custo válido e quantidade maior que zero.');return;}
 budgetMaterials.push({name,cost,qty,total:cost*qty});
 document.getElementById('bmName').value='';document.getElementById('bmCost').value='';document.getElementById('bmQty').value='1';
 renderBudgetMaterials();
}
function removeBudgetMaterial(i){budgetMaterials.splice(i,1);renderBudgetMaterials();}
function renderBudgetMaterials(){
 const el=document.getElementById('budgetMaterialsList');if(!el)return;
 el.innerHTML=budgetMaterials.map((m,i)=>`<div class="meta" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(m.name)}</b> · ${m.qty} × ${brl(m.cost)} = <b>${brl(m.total)}</b> <button class="secondary" onclick="removeBudgetMaterial(${i})">Remover</button></div>`).join('')||'<div class="empty">Nenhum material adicionado.</div>';
}
let lastBudget=null;
function calculateBudget(){
 const material=budgetMaterials.reduce((s,m)=>s+m.total,0),hours=Math.max(0,Number(document.getElementById('bHours').value||0)),hourly=Math.max(0,Number(document.getElementById('bHourly').value||0)),other=Math.max(0,Number(document.getElementById('bOther').value||0));
 const margin=Math.min(95,Math.max(0,Number(document.getElementById('bMargin').value||0)))/100,fees=Math.min(99,Math.max(0,Number(document.getElementById('bFees').value||0)))/100,discount=Math.min(90,Math.max(0,Number(document.getElementById('bDiscount').value||0)))/100;
 const labor=hours*hourly,cost=material+labor+other,denom=1-margin-fees;
 if(denom<=0||discount>=1){alert('Ajuste a margem e as taxas: a soma não pode chegar a 100%.');return;}
 const priceBeforeDiscount=cost/denom,price=priceBeforeDiscount/(1-discount),actualSale=price*(1-discount),feesValue=actualSale*fees,profit=actualSale-cost-feesValue;
 lastBudget={name:document.getElementById('bName').value.trim()||'Orçamento',client:document.getElementById('bClient').value.trim(),material,labor,other,cost,margin:margin*100,fees:fees*100,discount:discount*100,price,actualSale,feesValue,profit,materials:budgetMaterials.map(x=>({...x}))};
 document.getElementById('budgetOutput').innerHTML=`<div class="budget-result"><div class="label">Preço sugerido para informar ao cliente</div><div class="big">${brl(price)}</div><div class="meta">Preço com desconto aplicado: ${brl(actualSale)}</div></div>
 <div class="stats"><div class="stat"><div class="label">Materiais</div><div class="value">${brl(material)}</div></div><div class="stat"><div class="label">Mão de obra</div><div class="value">${brl(labor)}</div></div><div class="stat"><div class="label">Custo total</div><div class="value redtext">${brl(cost)}</div></div><div class="stat"><div class="label">Lucro estimado</div><div class="value goldtext">${brl(profit)}</div></div></div>
 <div class="card"><div class="meta">Outros custos: ${brl(other)} · Taxas estimadas: ${brl(feesValue)} · Margem desejada: ${margin*100}% · Desconto: ${discount*100}%</div></div>
 <p class="small">Fórmula: preço-base = custo total ÷ (1 − margem − taxas). O desconto é aplicado sobre o preço informado. É uma estimativa: inclua energia, desgaste de ferramentas, perdas de MDF e impostos reais em “Outros custos”/taxas.</p>`;
}
function saveBudgetAsOrder(){
 if(!lastBudget){calculateBudget();if(!lastBudget)return;}
 const b=lastBudget;
 const data={number:Date.now().toString().slice(-6),client:b.client||'A definir',product:b.name,price:b.price,cost:b.cost,paid:0,status:'Orçamento',created:new Date().toISOString().slice(0,10),notes:`Orçamento: materiais ${brl(b.material)}, mão de obra ${brl(b.labor)}, outros custos ${brl(b.other)}, lucro estimado ${brl(b.profit)}. Materiais: ${b.materials.map(m=>`${m.name} (${m.qty} × ${brl(m.cost)})`).join('; ')}`};
 try {
  let arr=JSON.parse(localStorage.getItem('imperio_orders')||'[]');
  if(!Array.isArray(arr))arr=[];
  arr.unshift(data);localStorage.setItem('imperio_orders',JSON.stringify(arr));
  alert('Orçamento salvo como pedido. Confira na aba Pedidos.');
  setTab('pedidos');
 }catch(e){alert('Não foi possível salvar automaticamente. Copie os valores do orçamento antes de sair.');}
}

function renderCharts(range='6m',scope='loja'){
 const allOrders=orders(), allExpenses=expenses();
 const now=new Date(); now.setHours(0,0,0,0);
 const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
 let from=new Date(monthStart);
 if(range==='30d')from=new Date(now.getFullYear(),now.getMonth(),now.getDate()-29);
 else if(range==='90d')from=new Date(now.getFullYear(),now.getMonth(),now.getDate()-89);
 else if(range==='12m')from=new Date(now.getFullYear(),now.getMonth()-11,1);
 else from=new Date(now.getFullYear(),now.getMonth()-5,1);
 const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const start=iso(from), end=iso(now);
 const inRange=d=>{const v=String(d||'').slice(0,10);return v&&v>=start&&v<=end;};
 const scopedExpenses=allExpenses.filter(e=>(e.scope||'loja')===scope&&inRange(e.date||e.created));
 const scopedOrders=allOrders.filter(o=>(o.scope||'loja')===scope&&inRange(o.created||o.date||o.due));
 const paidExpenses=scopedExpenses.filter(e=>e.status==='paga'||!e.status);
 const expenseTotal=paidExpenses.reduce((s,e)=>s+Number(e.amount||0),0);
 const launchedTotal=scopedExpenses.reduce((s,e)=>s+Number(e.amount||0),0);
 const revenue=scopedOrders.reduce((s,o)=>s+Number(o.price||0),0);
 const receivedTotal=scopedOrders.reduce((s,o)=>s+received(o),0);
 const costTotal=scopedOrders.reduce((s,o)=>s+costs(o),0);
 const grossProfit=revenue-costTotal;
 const netEstimated=grossProfit-expenseTotal;
 const grossMargin=revenue?grossProfit/revenue*100:0;
 const netMargin=revenue?netEstimated/revenue*100:0;
 const expenseRatio=revenue?expenseTotal/revenue*100:0;
 const fmtPct=n=>`${(Number.isFinite(n)?n:0).toLocaleString('pt-BR',{maximumFractionDigits:1})}%`;
 const catMap={};paidExpenses.forEach(e=>{const c=e.category||'Outros';catMap[c]=(catMap[c]||0)+Number(e.amount||0);});
 const catEntries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
 const maxCat=Math.max(1,...catEntries.map(x=>x[1]));
 const categoryBars=catEntries.map(([name,value])=>{const pct=expenseTotal?value/expenseTotal*100:0;return `<div class="chart-row"><div><b>${esc(name)}</b><div class="small">${fmtPct(pct)} das saídas pagas</div></div><div class="chart-track"><div class="chart-fill" style="width:${Math.max(0,Math.min(100,value/maxCat*100))}%;background:#c62838"></div></div><div style="text-align:right"><b>${brl(value)}</b></div></div>`;}).join('')||'<div class="empty">Ainda não há despesas pagas no período para classificar.</div>';
 const monthNames=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
 const months=[];const count=range==='12m'?12:range==='90d'?3:range==='30d'?1:6;
 for(let i=count-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months.push({key,label:monthNames[d.getMonth()],sales:0,costs:0,expenses:0,net:0});}
 const monthMap=Object.fromEntries(months.map(m=>[m.key,m]));
 scopedOrders.forEach(o=>{const key=String(o.created||o.date||o.due||'').slice(0,7);if(monthMap[key]){monthMap[key].sales+=Number(o.price||0);monthMap[key].costs+=costs(o);}});
 paidExpenses.forEach(e=>{const key=String(e.date||e.created||'').slice(0,7);if(monthMap[key])monthMap[key].expenses+=Number(e.amount||0);});
 months.forEach(m=>m.net=m.sales-m.costs-m.expenses);
 const maxMonth=Math.max(1,...months.flatMap(m=>[m.sales,m.expenses,m.costs]));
 const chartMonths=months.map(m=>`<div class="month-col"><div class="month-bars"><div class="month-bar" title="Vendas ${brl(m.sales)}" style="height:${Math.max(m.sales?3:0,m.sales/maxMonth*112)}px;background:#b7791f"></div><div class="month-bar" title="Custos dos pedidos ${brl(m.costs)}" style="height:${Math.max(m.costs?3:0,m.costs/maxMonth*112)}px;background:#537ca5"></div><div class="month-bar" title="Despesas pagas ${brl(m.expenses)}" style="height:${Math.max(m.expenses?3:0,m.expenses/maxMonth*112)}px;background:#c62838"></div></div><div class="month-label">${m.label}</div><div class="small">${brl(m.net)}</div></div>`).join('');
 const orderRows=scopedOrders.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,15).map(o=>{const price=Number(o.price||0),cost=costs(o),gross=price-cost,pct=price?gross/price*100:0;return `<div class="card"><div class="cardtop"><div><b>#${esc(o.number||'—')} · ${esc(o.client||'Cliente')}</b><div class="meta">Venda ${brl(price)} · Custo cadastrado ${brl(cost)}</div></div><div class="money ${gross<0?'redtext':'green'}">${brl(gross)}</div></div><div class="chart-track" style="margin-top:10px"><div class="chart-fill" style="width:${Math.max(0,Math.min(100,pct))}%;background:${gross<0?'#c62838':'#16845b'}"></div></div><div class="meta">Margem bruta estimada: ${fmtPct(pct)} · Não inclui rateio de despesas gerais.</div></div>`;}).join('')||'<div class="empty">Não há pedidos no período selecionado.</div>';
 const scopeButtons=`<div class="row" style="margin-bottom:12px"><button class="${scope==='loja'?'':'secondary'}" onclick="renderCharts('${range}','loja')">🏪 Loja</button><button class="${scope==='pessoal'?'':'secondary'}" onclick="renderCharts('${range}','pessoal')">👤 Pessoal</button></div>`;

function loadWoodProjectPhoto(event){

 if(!file.type.startsWith('image/')){alert('Selecione um arquivo de imagem.');return;}
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();img.onload=()=>{
   const scale=Math.min(1,1200/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   woodProjectPhoto=canvas.toDataURL('image/jpeg',.72);
   const el=document.getElementById('woodPhotoPreview');if(el)el.innerHTML=`<img class="project-image" src="${woodProjectPhoto}" alt="Foto de referência">`;
  };img.src=reader.result;
 };reader.readAsDataURL(file);
}
let woodAiAnalysis=null;
async function analyzeWoodProjectPhoto(){
 if(!woodProjectPhoto){alert('Envie uma foto ou desenho antes de solicitar a análise.');return;}
 const out=document.getElementById('woodAiResult');if(!out)return;
 if(!supabaseClient||!currentUser){alert('Entre na sua conta para analisar a imagem.');return;}
 out.innerHTML='<div class="project-note">Analisando a imagem… aguarde. A leitura será apresentada para conferência antes de alterar o projeto.</div>';
 try{
  const {data,error}=await supabaseClient.functions.invoke('interpret-project-image',{body:{image:woodProjectPhoto}});
  if(error)throw error;
  const result=data?.analysis||data;
  if(!result||typeof result!=='object'||!result.dimensions)throw new Error('A resposta da análise veio incompleta. Tente novamente com uma foto mais nítida.');
  woodAiAnalysis=result;
  const dim=result.dimensions||{};
  const items=(result.components||[]).map(x=>`<li><b>${esc(x.name||'Componente')}</b>${x.description?' — '+esc(x.description):''}</li>`).join('');
  const warnings=(result.uncertainties||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  out.innerHTML=`<div class="card"><h3>Leitura da IA — confira antes de aplicar</h3><div class="meta">Tipo identificado: ${esc(result.project_type||'Não identificado')} · Confiança: ${esc(result.confidence||'não informada')}</div><div class="grid2"><div><b>Largura</b><div>${dim.width_cm??'Não identificada'} cm</div></div><div><b>Altura</b><div>${dim.height_cm??'Não identificada'} cm</div></div><div><b>Profundidade</b><div>${dim.depth_cm??'Não identificada'} cm</div></div><div><b>Espessura</b><div>${dim.thickness_mm??'Não identificada'} mm</div></div></div><h4>Componentes percebidos</h4><ul>${items||'<li>Não foi possível identificar componentes com segurança.</li>'}</ul><h4>Pontos que precisam de confirmação</h4><ul>${warnings||'<li>Confira todas as medidas e a interpretação do desenho.</li>'}</ul><p class="small">${esc(result.notes||'A IA interpreta apenas o que está visível. Medidas ocultas, encaixes e cortes não devem ser presumidos.')}</p><button type="button" onclick="applyWoodAiAnalysis()">Aplicar medidas ao formulário</button><button type="button" class="secondary" onclick="woodAiAnalysis=null;document.getElementById('woodAiResult').innerHTML=''">Descartar leitura</button></div>`;
 }catch(e){console.error(e);out.innerHTML=`<div class="project-note">Não foi possível analisar a imagem: ${esc(e.message||e)}<br>Verifique se a função de IA foi publicada no Supabase e se a chave OPENAI_API_KEY foi configurada como segredo.</div>`;}
}

function woodSvgModel(type,w,h,d,t,shelves){
 const sx=180/Math.max(w,d,1),sy=145/Math.max(h,d,1),scale=Math.min(sx,sy,2.2);
 const X=w*scale,Y=d*scale,Z=h*scale,cx=280,base=220;
 const P=(x,y,z)=>[cx+(x-y)*.72,base+(x+y)*.38-z];
 const poly=(pts,fill,stroke='#34465a')=>`<polygon points="${pts.map(p=>{const q=P(...p);return q.join(',')}).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
 let faces='';
 if(type==='mesa'){
  const leg=Math.min(7,w/8,d/8)*scale,th=t*scale/10;
  faces+=poly([[0,0,h],[w,0,h],[w,d,h],[0,d,h]],'#c7d3df');
  faces+=poly([[0,0,h],[w,0,h],[w,0,h-t/10],[0,0,h-t/10]],'#9aaaba');
  [[0,0],[w-leg,0],[0,d-leg],[w-leg,d-leg]].forEach(([x,y])=>{
   faces+=poly([[x,y,0],[x+leg,y,0],[x+leg,y,h-t/10],[x,y,h-t/10]],'#b5c3d0');
   faces+=poly([[x+leg,y,0],[x+leg,y+leg,0],[x+leg,y+leg,h-t/10],[x+leg,y,h-t/10]],'#8fa0b1');
  });
 }else{
  // carcass outer faces
  faces+=poly([[0,0,0],[w,0,0],[w,0,h],[0,0,h]],'#d5dee7');
  faces+=poly([[w,0,0],[w,d,0],[w,d,h],[w,0,h]],'#aab8c7');
  faces+=poly([[0,0,h],[w,0,h],[w,d,h],[0,d,h]],'#edf1f5');
  faces+=poly([[0,d,0],[w,d,0],[w,d,h],[0,d,h]],'#9baaba');
  if(type==='caixa'){
   faces+=poly([[0,0,0],[0,d,0],[0,d,h],[0,0,h]],'#b8c6d3');
  }else{
   const innerW=Math.max(0,w-2*t/10),innerH=Math.max(0,h-2*t/10);
   for(let i=1;i<=shelves;i++){
    const z=t/10+(innerH/(shelves+1))*i;
    faces+=poly([[t/10,0,z],[w-t/10,0,z],[w-t/10,d,z],[t/10,d,z]],'#b7c8d8');
   }
  }
 }
 return `<svg class="project-model" viewBox="0 0 560 330" role="img" aria-label="Modelo 3D paramétrico do projeto"><defs><linearGradient id="woodBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbfd"/><stop offset="1" stop-color="#e4eaf0"/></linearGradient></defs><rect width="560" height="330" rx="12" fill="url(#woodBg)"/>${faces}<text x="22" y="28" fill="#34465a" font-size="13" font-weight="700">VISTA ISOMÉTRICA • MODELO PARAMÉTRICO</text><text x="22" y="310" fill="#53677b" font-size="12">${w} × ${h} × ${d} cm · placa ${t} mm</text></svg>`;
}
function woodExplodedBoxSvg(w,h,d,t){
 const k=t/10,iw=w-2*k,ih=h-2*k,id=d-2*k;
 const rect=(x,y,a,b,label,fill)=>`<rect x="${x}" y="${y}" width="${a}" height="${b}" rx="3" fill="${fill}" stroke="#34465a" stroke-width="2"/><text x="${x+a/2}" y="${y+b/2}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#203246">${label}</text>`;
 return `<svg class="project-model" viewBox="0 0 620 350" role="img" aria-label="Vista desmontada dos painéis da caixa"><rect width="620" height="350" rx="12" fill="#eef2f6"/><text x="20" y="25" fill="#34465a" font-size="13" font-weight="700">VISTA DESMONTADA • PAINÉIS SEPARADOS</text>${rect(220,45,160,105,`Frente ${w}×${h}`,'#d5a66e')}${rect(220,205,160,105,`Fundo ${w}×${h}`,'#d5a66e')}${rect(20,100,115,155,`Lateral 1 ${ih}×${id}`,'#b9c8d6')}${rect(485,100,115,155,`Lateral 2 ${ih}×${id}`,'#b9c8d6')}${rect(165,275,125,48,`Tampo ${iw}×${id}`,'#c6d2dd')}${rect(330,275,125,48,`Base ${iw}×${id}`,'#c6d2dd')}<text x="20" y="338" font-size="11" fill="#53677b">Medidas em cm • espessura ${t} mm • sem duto ou reforços</text></svg>`;
}
function generateWoodParts(type,w,h,d,t,shelves,backT,gap){
 const tc=t/10,gt=gap/10,innerW=w-2*tc-gt,innerH=h-2*tc-gt,parts=[];
 const add=(name,qty,a,b,thick=t)=>{if(qty>0&&a>0&&b>0)parts.push({name,qty,width:+a.toFixed(2),height:+b.toFixed(2),thickness:thick});};
 if(type==='caixa'){
  // Frente e fundo inteiros cobrem as bordas; laterais, tampo e base ficam entre eles.
  const sideH=h-2*tc, sideD=d-2*tc, topBottomW=w-2*tc;
  if(sideH<=0||sideD<=0||topBottomW<=0) throw new Error('Dimensões insuficientes para a espessura selecionada.');
  add('Frente (painel inteiro)',1,w,h);
  add('Fundo (painel inteiro)',1,w,h);
  add('Laterais',2,sideH,sideD);
  add('Tampo e base',2,topBottomW,sideD);
 }else if(type==='mesa'){
  add('Tampo',1,w,d);const leg=Math.min(7,w/8,d/8);
  add('Pé',4,Math.max(1,h-t/10),leg);
 }else{
  add('Lateral esquerda/direita',2,h,d);
  add('Tampo / base',2,innerW,d);
  add('Prateleira',shelves,innerW,d);
  if(backT>0)add('Fundo',1,innerW,innerH,backT);
 }
 return parts;
}
async function generateWoodProject(){
 const name=document.getElementById('woodName').value.trim()||'Projeto de marcenaria';
 const type=document.getElementById('woodType').value,material=document.getElementById('woodMaterial').value;
 const w=Number(document.getElementById('woodW').value),h=Number(document.getElementById('woodH').value),d=Number(document.getElementById('woodD').value);
 const t=Number(document.getElementById('woodT').value),shelves=Math.floor(Number(document.getElementById('woodShelves').value||0)),backT=Number(document.getElementById('woodBackT').value),gap=Number(document.getElementById('woodGap').value||0),notes=document.getElementById('woodNotes').value.trim();
 if(!(w>0&&h>0&&d>0&&t>0)||shelves<0||shelves>20){alert('Confira as dimensões, espessura e quantidade de prateleiras.');return;}
 if(type!=='caixa'&&type!=='mesa'&&(w<=2*t/10||h<=2*t/10)){alert('As dimensões externas são pequenas demais para a espessura selecionada.');return;}
 const parts=generateWoodParts(type,w,h,d,t,shelves,backT,gap);
 const model=woodSvgModel(type,w,h,d,t,shelves);
 const typeNames={nicho:'Nicho / prateleira',armario:'Armário simples',caixa:'Caixa acústica retangular',mesa:'Mesa simples'};
 const total=parts.reduce((s,p)=>s+p.qty,0);
 const partRows=parts.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td>${p.width.toFixed(2)} × ${p.height.toFixed(2)} cm</td><td>${p.thickness} mm</td></tr>`).join('');
 const html=`<div class="formbox section"><h3>3. Modelo 3D e resultado</h3><div class="project-preview"><div>${model}${type==='caixa'?woodExplodedBoxSvg(w,h,d,t):''}<p class="small">Modelo paramétrico ilustrativo. Confirme encaixes, sentido do veio, espessuras e ferragens antes da fabricação.</p></div><div class="card"><b>${esc(name)}</b><div class="meta">${typeNames[type]} · ${material}<br>Dimensões externas: ${w} × ${h} × ${d} cm<br>${type==='caixa'?`Dimensões internas brutas: ${(w-2*t/10).toFixed(1)} × ${(h-2*t/10).toFixed(1)} × ${(d-2*t/10).toFixed(1)} cm<br>Volume interno bruto: ${((w-2*t/10)*(h-2*t/10)*(d-2*t/10)/1000).toFixed(1)} L (antes de duto, falante e reforços)<br>`:''}Placas: ${t} mm · Peças: ${total}</div>${woodProjectPhoto?`<img class="project-image" style="margin-top:10px" src="${woodProjectPhoto}" alt="Referência">`:''}</div></div><h3 style="margin-top:18px">Lista de peças para fabricação</h3><div style="overflow-x:auto"><table class="project-parts"><thead><tr><th>Peça</th><th>Qtd.</th><th>Corte (largura × comprimento)</th><th>Espessura</th></tr></thead><tbody>${partRows}</tbody></table></div><div class="project-note" style="margin-top:12px">Este é um pré-projeto. Não inclui automaticamente portas, dobradiças, corrediças, cavilhas, parafusos, usinagens, recortes, travessas ou cálculo estrutural/acústico. Esses detalhes precisam ser adicionados e conferidos conforme o projeto real.</div><p class="small">Observações: ${esc(notes||'Nenhuma')}</p><div class="row"><button onclick="sendWoodPartsToCut()">Enviar peças ao plano de corte</button><button class="secondary" onclick="window.print()">Imprimir ficha</button></div><button class="gold" style="width:100%;margin-top:8px" onclick="saveWoodProject()">Salvar projeto</button></div>`;

function calculateCutPlan(){
const sw=Math.round(Number(document.getElementById('sheetW').value)*10),sh=Math.round(Number(document.getElementById('sheetH').value)*10),
kerf=Math.max(0,Number(document.getElementById('kerf').value||0)*10),
margin=Math.max(0,Number(document.getElementById('margin').value||0)*10),
sheetPrice=Math.max(0,Number(document.getElementById('sheetPrice')?.value||0)),
allowRotate=!!document.getElementById('allowRotate')?.checked,
method=document.getElementById('optimizationMethod')?.value||'auto',out=document.getElementById('cutResults');
if(!(sw>0&&sh>0)||!cutParts.length){out.innerHTML='<div class="empty">Informe a chapa e adicione ao menos uma peça.</div>';return;}
const aw=sw-2*margin,ah=sh-2*margin;
if(aw<=0||ah<=0){out.innerHTML='<div class="empty">Margem inválida.</div>';return;}
const expanded=cutParts.map((p,idx)=>({...p,idx}));
const invalid=expanded.filter(p=>!((p.w<=aw&&p.h<=ah)||(allowRotate&&p.h<=aw&&p.w<=ah)));
const valid=expanded.filter(p=>!invalid.includes(p));
const sorterMap={
area:(a,b)=>b.w*b.h-a.w*a.h,
longside:(a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h),
height:(a,b)=>b.h-a.h||b.w-a.w,
width:(a,b)=>b.w-a.w||b.h-a.h,
shortside:(a,b)=>Math.min(b.w,b.h)-Math.min(a.w,a.h)
};
function pack(order){
 let sheets=[];
 for(const p of order){
  let best=null;
  for(let si=0;si<sheets.length;si++){
   const s=sheets[si];
   for(const rot of (allowRotate?[false,true]:[false])){
    const w=rot?p.h:p.w,h=rot?p.w:p.h;
    if(w>aw||h>ah)continue;
    for(let ri=0;ri<s.rows.length;ri++){
     const row=s.rows[ri];
     if(h<=row.h && row.x+w<=aw){
      const score=(row.h-h)*aw+(aw-(row.x+w));
      if(!best||score<best.score)best={si,ri,rot,w,h,score,newRow:false};
     }
    }
    const y=s.rows.reduce((sum,r)=>sum+r.h+kerf,0);
    if(y+h<=ah){
     const score=(ah-(y+h))*aw+(aw-w);
     if(!best||score<best.score)best={si,ri:s.rows.length,rot,w,h,score,newRow:true};
    }
   }
  }
  if(!best){
   const s={rows:[],items:[]};sheets.push(s);
   let opts=[{rot:false,w:p.w,h:p.h}];
   if(allowRotate&&p.w!==p.h)opts.push({rot:true,w:p.h,h:p.w});
   opts=opts.filter(o=>o.w<=aw&&o.h<=ah).sort((a,b)=>(ah-a.h)*aw+(aw-a.w)-((ah-b.h)*aw+(aw-b.w)));
   if(!opts.length)continue;
   best={si:sheets.length-1,ri:0,...opts[0],newRow:true};
  }
  const s=sheets[best.si];
  if(best.newRow){const y=s.rows.reduce((sum,r)=>sum+r.h+kerf,0);s.rows.push({x:0,y,h:best.h});}
  const row=s.rows[best.ri],x=row.x,y=row.y;
  s.items.push({...p,w:best.w,h:best.h,rot:best.rot,x:x+margin,y:y+margin});
  row.x+=best.w+kerf;
 }
 return sheets.filter(s=>s.items.length);
}
const methods=method==='auto'?Object.keys(sorterMap):[method];
let candidates=methods.map(key=>({key,sheets:pack(valid.slice().sort(sorterMap[key]))}));
const used=x=>x.reduce((n,s)=>n+s.items.reduce((m,p)=>m+p.w*p.h,0),0);
candidates.sort((a,b)=>a.sheets.length-b.sheets.length||used(b.sheets)-used(a.sheets));
const chosen=candidates[0]||{key:method,sheets:[]},sheets=chosen.sheets;
const methodNames={area:'Maior área primeiro',longside:'Maior lado primeiro',height:'Maior comprimento primeiro',width:'Maior largura primeiro',shortside:'Menor lado primeiro'};
const placed=sheets.flatMap(s=>s.items),area=cutParts.reduce((sum,p)=>sum+p.w*p.h,0),
totalSheetArea=sheets.length*sw*sh,yieldPct=totalSheetArea?100*area/totalSheetArea:0,

const colors=['#e32636','#d7ad55','#4b91d1','#55c58a','#a78bfa','#e879c5','#f97316','#22b8cf'];
const drawings=sheets.map((s,si)=>`<div class="card"><b>Chapa ${si+1}</b><div style="overflow-x:auto;margin-top:8px"><svg viewBox="0 0 ${sw} ${sh}" style="width:100%;min-width:280px;background:#eee;border:1px solid var(--line);height:auto;max-height:460px"><rect width="${sw}" height="${sh}" fill="#e5e7eb"/><rect x="${margin}" y="${margin}" width="${aw}" height="${ah}" fill="#f8fafc" stroke="#555" stroke-dasharray="10 8" stroke-width="3"/>${s.items.map(p=>`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${colors[p.idx%colors.length]}" fill-opacity=".85" stroke="#fff" stroke-width="3"/><text x="${p.x+p.w/2}" y="${p.y+p.h/2-5}" font-size="${Math.max(22,Math.min(48,Math.min(p.w,p.h)/5))}" text-anchor="middle" fill="#111" font-weight="700">${esc(p.name).slice(0,16)}</text><text x="${p.x+p.w/2}" y="${p.y+p.h/2+30}" font-size="${Math.max(18,Math.min(34,Math.min(p.w,p.h)/7))}" text-anchor="middle" fill="#111">${cm(p.w)}×${cm(p.h)} cm${p.rot?' ↻':''}</text>`).join('')}</svg></div><div class="small">Peças nesta chapa: ${s.items.length}</div></div>`).join('');
const printSummary=`<div class="print-only"><h2>Plano de corte MDF — Império Art Sound</h2><p>Chapa: ${cm(sw)} × ${cm(sh)} cm | MDF: ${document.getElementById('sheetT').value} mm | Serra: ${cm(kerf)} cm | Margem: ${cm(margin)} cm</p><p>Método: ${method==='auto'?'Automático':methodNames[chosen.key]} | Rotação: ${allowRotate?'permitida':'desativada'} | Data: ${new Date().toLocaleDateString('pt-BR')}</p></div>`;
out.innerHTML=`${printSummary}<div class="row no-print" style="justify-content:flex-end"><button onclick="window.print()">Imprimir plano</button></div><div class="stats"><div class="stat"><div class="label">Peças encaixadas</div><div class="value">${placed.length}/${cutParts.length}</div></div><div class="stat"><div class="label">Chapas estimadas</div><div class="value">${sheets.length}</div></div><div class="stat"><div class="label">Aproveitamento</div><div class="value goldtext">${yieldPct.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</div></div><div class="stat"><div class="label">Custo das chapas</div><div class="value">${brl(sheetCost)}</div></div></div><div class="card section"><b>Estimativa de material</b><p>Compra de ${sheets.length} chapa(s): <b>${brl(sheetCost)}</b></p><p>Custo proporcional da área ocupada pelas peças: <b>${brl(partCost)}</b></p><p>Valor estimado da área restante/perdas: <b>${brl(wasteCost)}</b></p><p class="small">Rateio proporcional à área; não inclui veio, defeitos ou perdas adicionais.</p></div><p class="small">Método aplicado: <b>${method==='auto'?'Automático — '+methodNames[chosen.key]:methodNames[chosen.key]}</b>. Heurística por faixas; não garante ótimo global.</p>${invalid.length?`<div class="card"><b class="redtext">Peças que não couberam</b><div class="meta">${invalid.map(p=>`${esc(p.name)} — ${cm(p.w)} × ${cm(p.h)} cm`).join('<br>')}</div></div>`:''}${drawings}`;
}

function cashManual(){return records.filter(x=>x.kind==='cash_movement').sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function cashRows(scope,from,to){
 const rows=[];
 // Entradas efetivamente recebidas nos pagamentos vinculados aos pedidos.
 if(scope==='loja'){
  orders().forEach(o=>(o.payments||[]).forEach((p,i)=>{

  }));
 }
 // Saídas: somente contas marcadas como pagas, na data em que foram pagas.
 expenses().filter(e=>(e.scope||'loja')===scope&&e.status==='paga').forEach(e=>{
  const d=e.paidDate||e.date||dateNow();
  if(d>=from&&d<=to)rows.push({id:`expense-${e.id}`,date:d,direction:'saida',description:e.description||'Despesa',category:e.category||'Despesa',amount:Number(e.amount||0),source:'Despesa'});
 });
 cashManual().filter(x=>(x.scope||'loja')===scope&&x.date>=from&&x.date<=to).forEach(x=>rows.push({...x,source:'Lançamento manual'}));
 return rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function cashTotals(scope,from,to){
 const rows=cashRows(scope,from,to),ins=rows.filter(x=>x.direction==='entrada').reduce((a,x)=>a+x.amount,0),outs=rows.filter(x=>x.direction==='saida').reduce((a,x)=>a+x.amount,0);
 return {rows,ins,outs,net:ins-outs};
}
// Saldo de abertura acumulado: usa o último fechamento anterior como ponto de controle;
// soma as movimentações posteriores a ele. Sem fechamento anterior, usa o saldo-base cadastrado.
function cashBalanceBefore(scope,beforeDate){
 const closures=records.filter(x=>x.kind==='cash_closure'&&(x.scope||'loja')===scope).map(x=>{
  let end=x.date||'';
  if(x.period==='month'&&/^\d{4}-\d{2}$/.test(end)){
   const [yy,mm]=end.split('-').map(Number);const last=new Date(yy,mm,0).getDate();end=`${yy}-${String(mm).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
  }
  return {...x,endDate:end};
 }).filter(x=>x.endDate&&x.endDate<beforeDate).sort((a,b)=>b.endDate.localeCompare(a.endDate));
 const last=closures[0];
 let balance=last?Number(last.counted??last.expected??0):Number(records.find(x=>x.kind==='cash_balance'&&(x.scope||'loja')===scope)?.amount||0);
 const from=last?(()=>{const d=new Date(last.endDate+'T12:00:00');d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;})():'0000-01-01';
 if(from<beforeDate)balance+=cashTotals(scope,from,(()=>{const d=new Date(beforeDate+'T12:00:00');d.setDate(d.getDate()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;})()).net;
 return balance;
}

 const day=cashTotals(scope,today,today),monthly=cashTotals(scope,monthStart,monthEnd);

 const dailyRows=dailyChronological.reverse();
 app.innerHTML=`<h2>Caixa — entradas, saídas e fechamentos</h2>
 <div class="row" style="margin-bottom:12px"><div class="field"><label>Caixa separado</label><select id="cashScope" onchange="renderCashControl()"><option value="loja" ${scope==='loja'?'selected':''}>🏪 Loja</option><option value="pessoal" ${scope==='pessoal'?'selected':''}>👤 Pessoal</option></select></div><div class="field"><label>Mês para análise</label><input id="cashMonth" type="month" value="${month}" onchange="renderCashControl()"></div></div>

 </div>
 <div class="section"><h3>Resumo diário</h3><p class="small">Cada linha mostra o total que entrou, saiu e o resultado daquele dia.</p>
 ${dailyRows.map(x=>`<div class="card"><div class="cardtop"><div><b>${fmtDate(x.date)}</b><div class="meta">${x.count} movimentação(ões)</div></div><div class="money ${x.net<0?'redtext':'green'}">${brl(x.net)}</div></div><div class="stats"><div class="stat"><div class="label">Saldo anterior</div><div class="value ${x.opening<0?'redtext':'green'}">${brl(x.opening)}</div></div><div class="stat"><div class="label">Entrou</div><div class="value green">${brl(x.ins)}</div></div><div class="stat"><div class="label">Saiu</div><div class="value redtext">${brl(x.outs)}</div></div><div class="stat"><div class="label">Resultado do dia</div><div class="value ${x.net<0?'redtext':'green'}">${brl(x.net)}</div></div><div class="stat"><div class="label">Saldo acumulado</div><div class="value ${x.closing<0?'redtext':'green'}">${brl(x.closing)}</div></div></div></div>`).join('')||'<div class="empty">Nenhuma entrada ou saída registrada neste mês.</div>'}
 </div>
 <div class="formbox section"><h3>Registrar entrada ou saída de dinheiro</h3><form id="cashMovementForm" onsubmit="saveCashMovement(event,'${scope}');return false;"><div class="grid2">
 <div class="field"><label>Tipo</label><select name="direction"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div>
 <div class="field"><label>Valor (R$)</label><input name="amount" type="number" min=".01" step=".01" required placeholder="0,00"></div>
 <div class="field"><label>Data</label><input name="date" type="date" value="${today}" required></div>
 <div class="field"><label>Categoria</label><select name="category">${(scope==='loja'?['Venda avulsa','Aporte','Retirada','Fornecedor','Transporte','Taxas','Outros']:['Salário/renda','Transferência recebida','Alimentação','Moradia','Transporte','Saúde','Lazer','Dívida','Outros']).map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div class="field full"><label>Descrição</label><input name="description" required placeholder="Descreva a movimentação"></div>
 <div class="field full"><label>Forma</label><select name="method"><option>Dinheiro</option><option>Pix</option><option>Cartão</option><option>Transferência</option><option>Outro</option></select></div></div><button type="submit">＋ Registrar movimentação</button></form></div>
 <div class="formbox section"><h3>Fechamento diário · ${fmtDate(today)}</h3>
 <p class="small">Saldo trazido dos dias anteriores: ${brl(dayOpening)} · entradas hoje: ${brl(day.ins)} · saídas hoje: ${brl(day.outs)} · saldo esperado no fechamento: ${brl(dayExpected)}.</p>
 <div class="grid2"><div class="field"><label>Dinheiro/ saldo contado no fechamento (R$)</label><input id="dayCounted" type="number" min="0" step=".01" value="${dayClose?.counted??''}" placeholder="Informe o valor contado"></div><div class="field"><label>Observação</label><input id="dayNote" value="${esc(dayClose?.notes||'')}" placeholder="Diferenças ou observações"></div></div>
 <button onclick="closeCash('day','${scope}','${today}')">${dayClose?'Atualizar fechamento do dia':'Fechar caixa do dia'}</button>
 ${dayClose?`<p class="small">Fechado em ${new Date(dayClose.closedAt).toLocaleString('pt-BR')} · Contado: ${brl(dayClose.counted)} · Diferença informada: ${brl(Number(dayClose.counted)-Number(dayClose.expected||0))}</p>`:''}</div>
 <div class="formbox section"><h3>Fechamento mensal · ${month}</h3>
 <p class="small">Saldo inicial trazido: ${brl(opening)} · ${monthly.rows.length} movimentação(ões) · resultado do mês: ${brl(monthly.net)} · saldo final esperado: ${brl(monthClosing)}.</p>
 <div class="grid2"><div class="field"><label>Saldo contado no fechamento (R$)</label><input id="monthCounted" type="number" min="0" step=".01" value="${monthClose?.counted??''}" placeholder="Informe o saldo final"></div><div class="field"><label>Observação</label><input id="monthNote" value="${esc(monthClose?.notes||'')}" placeholder="Resumo do mês"></div></div>
 <button class="gold" onclick="closeCash('month','${scope}','${month}')">${monthClose?'Atualizar fechamento mensal':'Fechar mês'}</button>
 ${monthClose?`<p class="small">Fechado em ${new Date(monthClose.closedAt).toLocaleString('pt-BR')} · Contado: ${brl(monthClose.counted)} · Diferença: ${brl(Number(monthClose.counted)-Number(monthClose.expected||0))}</p>`:''}</div>
 <div class="section"><h3>Livro-caixa do mês · ${monthly.rows.length} lançamentos</h3><p class="small">Não lance manualmente um recebimento que já foi registrado nos pagamentos de um pedido, nem uma despesa já marcada como paga: isso duplicaria o caixa.</p>${monthly.rows.slice().reverse().map(x=>`<div class="card"><div class="cardtop"><div><b>${esc(x.description)}</b><div class="meta">${fmtDate(x.date)} · ${esc(x.category||'')} · ${esc(x.source||'')}</div></div><div class="money ${x.direction==='entrada'?'green':'redtext'}">${x.direction==='entrada'?'+':'−'} ${brl(x.amount)}</div></div>${x.method?`<div class="meta">${esc(x.method)}</div>`:''}${x.source==='Lançamento manual'?`<div class="actions"><button class="danger" onclick="deleteCashMovement('${x.id}','${scope}')">Excluir</button></div>`:''}</div>`).join('')||'<div class="empty">Nenhuma movimentação neste mês.</div>'}</div>
 <div class="section"><h3>Histórico de fechamentos</h3>${records.filter(x=>x.kind==='cash_closure'&&x.scope===scope).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="card"><b>${x.period==='day'?'Diário':'Mensal'} · ${esc(x.date)}</b><div class="meta">Entradas ${brl(x.income)} · Saídas ${brl(x.expenses)} · Resultado ${brl(x.net)} · Contado ${brl(x.counted)} · Diferença ${brl(Number(x.counted)-Number(x.expected||0))}</div></div>`).join('')||'<div class="empty">Ainda não há fechamentos salvos.</div>'}</div>`;
}
async function saveCashMovement(e,scope){
 e.preventDefault();
 const form=e.currentTarget, d=Object.fromEntries(new FormData(form).entries());
 const amount=Number(d.amount);
 if(!['entrada','saida'].includes(d.direction)){alert('Selecione entrada ou saída.');return;}
 if(!Number.isFinite(amount)||amount<=0){alert('Informe um valor maior que zero.');return;}
 if(!d.date||!d.description?.trim()){alert('Informe a data e a descrição.');return;}
 const rec={...d,id:crypto.randomUUID(),kind:'cash_movement',scope,amount,description:d.description.trim(),created:new Date().toISOString()};
 try{
  await putRecord(rec);
  records=await allRecords();
  renderCashControl();
  alert('Movimentação registrada no caixa com sucesso.');
 }catch(err){
  console.error('Falha ao registrar movimento de caixa:',err);
  alert('Não foi possível registrar a movimentação: '+(err?.message||err));
 }
}
async function closeCash(period,scope,date){
 const isDay=period==='day',input=document.getElementById(isDay?'dayCounted':'monthCounted'),note=document.getElementById(isDay?'dayNote':'monthNote');
 if(!input.value||!Number.isFinite(Number(input.value))||Number(input.value)<0){alert('Informe o saldo contado para fechar o caixa.');return;}
 const from=isDay?date:date+'-01',to=isDay?date:new Date(Number(date.slice(0,4)),Number(date.slice(5,7)),0).toISOString().slice(0,10);
 const t=cashTotals(scope,from,to),id=`cash-closure-${period}-${scope}-${date}`;
 const old=records.find(x=>x.id===id);
 const opening=cashBalanceBefore(scope,from);
 const expected=opening+t.net;
 const closure={...(old||{}),id,kind:'cash_closure',period,scope,date,income:t.ins,expenses:t.outs,net:t.net,opening,expected,counted:Number(input.value),notes:note.value,closedAt:new Date().toISOString()};
 await putRecord(closure);await refresh();renderCashControl();alert('Fechamento salvo. O histórico foi atualizado.');
}
async function deleteCashMovement(id,scope){if(confirm('Excluir esta movimentação manual?')){await delRecord(id);await refresh();renderCashControl();}}

function renderBackup(){app.innerHTML=`<h2>Dados e segurança</h2><div class="card"><h3>Conta sincronizada</h3><p class="small">Conta: ${esc(currentUser?.email||'')}<br>Os registros são sincronizados com a nuvem. Para maior segurança, faça backup regularmente.</p><button class="secondary" onclick="signOut()">Sair da conta</button></div><div class="card"><h3>Backup completo</h3><p class="small">Exporta pedidos, pagamentos, despesas e anexos em um arquivo JSON. Guarde esse arquivo em local seguro. O backup é uma cópia adicional; não substitui a sincronização.</p><button onclick="exportBackup()">Exportar backup</button></div><div class="card"><h3>Restaurar backup</h3><p class="small">Importar um backup substitui os dados atuais. Exporte o estado atual antes de restaurar.</p><button class="secondary" onclick="document.getElementById('importFile').click()">Escolher arquivo de backup</button></div><div class="card"><h3>Resumo dos dados</h3><div class="meta">Pedidos: ${orders().length}<br>Despesas: ${expenses().length}<br>Anexos: ${orders().reduce((s,o)=>s+(o.photos||[]).length,0)} imagens</div><hr><button class="danger" onclick="clearAll()">Apagar todos os dados</button></div><p class="small">Privacidade: o acesso aos registros depende do login e das regras de segurança do banco. Proteja também o iPhone e o computador com senha.</p>`;
}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'Imperio Art Sound',version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`imperio-art-sound-backup-${dateNow()}.json`;a.click();URL.revokeObjectURL(a.href);}
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.records))throw Error('Arquivo inválido');if(!confirm('Isso substituirá todos os dados atuais. Continuar?'))return;const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE);store.clear();parsed.records.forEach(x=>store.put(x));tx.oncomplete=async()=>{await refresh();alert('Backup restaurado.');};}catch(err){alert('Não foi possível importar: '+err.message)}finally{e.target.value='';}});
async function clearAll(){if(!confirm('ATENÇÃO: apagar permanentemente todos os pedidos, pagamentos, despesas e anexos da nuvem e deste aparelho?'))return;if(!confirm('Confirme novamente: você exportou um backup?'))return;if(currentUser&&supabaseClient){const {error}=await supabaseClient.from('app_records').delete().eq('user_id',currentUser.id);if(error){alert('Não foi possível apagar na nuvem: '+error.message);return;}}const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=async()=>{await refresh();};}
async function signOut(){if(!confirm('Deseja sair da sua conta?'))return;await supabaseClient.auth.signOut();}
function capturePageDraft(key=tab){
 pageEditing[key]=editing;
 const root=document.getElementById('app');if(!root)return;
 const fields=[...root.querySelectorAll('input,select,textarea')].filter(el=>el.type!=='file'&&el.id!=='importFile');
 if(!fields.length)return;
 pageDrafts[key]=fields.map((el,index)=>({id:el.id||'',name:el.name||'',index,type:el.type||el.tagName.toLowerCase(),value:el.type==='checkbox'||el.type==='radio'?el.checked:el.value}));
}
function restorePageDraft(key){
 const saved=pageDrafts[key];if(!saved?.length)return;
 const root=document.getElementById('app');if(!root)return;restoringDraft=true;
 const fields=[...root.querySelectorAll('input,select,textarea')].filter(el=>el.type!=='file'&&el.id!=='importFile');
 saved.forEach(item=>{let el=item.id?fields.find(x=>x.id===item.id):null;if(!el&&item.name)el=fields.find(x=>x.name===item.name&&x.type===item.type);if(!el)el=fields[item.index];if(!el)return;if(el.type==='checkbox'||el.type==='radio')el.checked=!!item.value;else el.value=item.value;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));});
 restoringDraft=false;
}
function addPageControls(){
 const root=document.getElementById('app');if(!root||!root.firstElementChild)return;
 const bar=document.createElement('div');bar.className='page-controls';bar.innerHTML=`<button type="button" class="secondary" onclick="navigateBack()" ${pageHistory.length?'':'disabled'} aria-label="Voltar para a tela anterior">← Voltar</button><button type="button" class="secondary" onclick="navigateForward()" ${forwardHistory.length?'':'disabled'} aria-label="Avançar para a próxima tela">Avançar →</button><span class="page-location">${esc(tabLabel(tab))}</span>`;
 root.insertBefore(bar,root.firstChild);
}
const forwardHistory=[];
function tabLabel(key){return ({inicio:'Início',comercial:'Comercial',producao:'Produção',financeiro:'Financeiro',pedidos:'Pedidos',novo:'Novo pedido',orcamento:'Orçamentos',proposta:'Propostas',caixa:'Fluxo de caixa',pagar:'Contas a pagar',despesas:'Contas a pagar',despesasPagas:'Despesas realizadas',receber:'Contas a receber',contas:'Contas financeiras',graficos:'Indicadores',corte:'Plano de corte',projeto3d:'Projeto 3D',estoque:'Estoque',sistema:'Sistema e segurança',backup:'Backup'})[key]||'Área de trabalho';}
function setTab(t){if(!t||t===tab)return;capturePageDraft(tab);pageHistory.push(tab);if(pageHistory.length>40)pageHistory.shift();forwardHistory.length=0;try{history.pushState({iasTab:t},'','#'+encodeURIComponent(t));}catch(_){}tab=t;closeMobileMore();render();}
function navigateBack(){if(!pageHistory.length)return;capturePageDraft(tab);forwardHistory.push(tab);tab=pageHistory.pop();closeMobileMore();render();}
function navigateForward(){if(!forwardHistory.length)return;capturePageDraft(tab);pageHistory.push(tab);tab=forwardHistory.pop();closeMobileMore();render();}
window.addEventListener('popstate',()=>{if(pageHistory.length)navigateBack();});

function closeMobileMore(){const panel=document.getElementById('mobileMorePanel'),trigger=document.getElementById('mobileMoreTrigger');if(panel)panel.classList.remove('open');if(panel)panel.setAttribute('aria-hidden','true');if(trigger){trigger.classList.remove('is-open');trigger.setAttribute('aria-expanded','false');}}
const moreTrigger=document.getElementById('mobileMoreTrigger');if(moreTrigger)moreTrigger.addEventListener('click',()=>{const panel=document.getElementById('mobileMorePanel'),open=!panel.classList.contains('open');panel.classList.toggle('open',open);panel.setAttribute('aria-hidden',String(!open));moreTrigger.classList.toggle('is-open',open);moreTrigger.setAttribute('aria-expanded',String(open));});
const moreClose=document.getElementById('mobileMoreClose');if(moreClose)moreClose.addEventListener('click',closeMobileMore);
document.querySelectorAll('#mobileMorePanel [data-go]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.go)));
document.querySelectorAll('.nav button[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
(async()=>{try{db=await openDB();if(!window.supabase||!window.APP_CONFIG||!APP_CONFIG.url||!APP_CONFIG.anonKey||APP_CONFIG.url.includes('COLOQUE_')){app.innerHTML='<div class="card"><h2>Configuração necessária</h2><p class="small">O aplicativo precisa ser conectado ao projeto de banco de dados. Siga o arquivo LEIA-ME-NUVEM.txt incluído no pacote e preencha config.js antes de publicar.</p></div>';return;}supabaseClient=window.supabase.createClient(APP_CONFIG.url,APP_CONFIG.anonKey);const {data:{session}}=await supabaseClient.auth.getSession();if(session){currentUser=session.user;await startCloudApp();}else authScreen();supabaseClient.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;if(currentUser){await startCloudApp();}else{if(cloudChannel){await supabaseClient.removeChannel(cloudChannel);cloudChannel=null;}document.querySelector('.nav').style.display='none';authScreen();}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){app.innerHTML='<div class="empty">Não foi possível iniciar o aplicativo: '+esc(e.message||e)+'</div>';}})();
</script>
